*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.6;}
button{cursor:pointer;font-family:var(--font);}
.app{max-width:720px;margin:0 auto;padding:0 16px 100px;}

.hd-logo{font-size:.95rem;font-weight:800;color:var(--ink);letter-spacing:-.02em;}
.hd-logo em{color:var(--ink3);font-style:normal;font-weight:400;font-size:.78rem;margin-left:6px;}

.hero h1{font-size:1.45rem;font-weight:900;color:var(--ink);margin-bottom:8px;line-height:1.2;letter-spacing:-.03em;}

.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.hs{background:var(--sf);border:1px solid var(--rule);border-radius:var(--r);padding:14px 12px;text-align:center;}
.hs-v{font-size:1.4rem;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;}

.tc{background:var(--sf);border:1px solid var(--rule);border-radius:var(--r);padding:16px;cursor:pointer;transition:border-color .15s;text-align:left;position:relative;overflow:hidden;}

.tc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}

:root[data-theme=light] .d1{background:#DCF5E7;color:#0A6E42;}:root[data-theme=light] .d2{background:#E0EDFF;color:#1A4A9A;}:root[data-theme=light] .d3{background:#FEF5DB;color:#935200;}:root[data-theme=light] .d4{background:#FDEAEA;color:#B91818;}:root[data-theme=light] .d5{background:#EDE9FE;color:#5B21B6;}
:root[data-theme=dark] .d1{background:#0A3020;color:#5ACA88;}:root[data-theme=dark] .d2{background:#0A1E44;color:#7AAAE8;}:root[data-theme=dark] .d3{background:#2A1800;color:#EAC86C;}:root[data-theme=dark] .d4{background:#2A0808;color:#EF9090;}:root[data-theme=dark] .d5{background:#1E0A40;color:#B8A0EF;}
.tc-title{font-size:.92rem;font-weight:700;color:var(--ink);margin-bottom:4px;letter-spacing:-.01em;}
.tc-desc{font-size:.73rem;color:var(--ink3);line-height:1.5;margin-bottom:10px;}
.tc-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.tc-meta{font-size:.67rem;color:var(--ink3);}
.tc-done{padding:2px 8px;background:var(--ok-lt);color:var(--ok);border:1px solid var(--ok-bd);border-radius:3px;font-size:.65rem;font-weight:700;}
/* Test view */
.th{margin-bottom:20px;}
.th-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.back{display:flex;align-items:center;gap:5px;background:none;border:1px solid var(--rule);border-radius:4px;padding:6px 12px;font-size:.75rem;color:var(--ink2);transition:all .15s;}
.back:hover{border-color:var(--accent);color:var(--accent);}
.prog-wrap{height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:5px;}

.tname{font-size:1rem;font-weight:800;color:var(--ink);letter-spacing:-.02em;}

.qlist{display:flex;flex-direction:column;gap:12px;}

.qnum-badge{padding:1px 7px;background:var(--acc-lt);border-radius:3px;font-size:.63rem;}
.qtxt{font-size:.9rem;font-weight:600;color:var(--ink);line-height:1.55;margin-bottom:14px;}
.opts{display:flex;flex-direction:column;gap:6px;}
.opt{background:var(--sf2);border:1px solid var(--rule);border-radius:var(--r);padding:10px 13px;font-size:.82rem;color:var(--ink2);text-align:left;transition:border-color .15s,color .15s;display:flex;align-items:flex-start;gap:10px;line-height:1.45;}
.opt:hover{border-color:var(--accent);color:var(--ink);}
.opt.sel{background:var(--acc-lt);border-color:var(--accent);color:var(--accent);font-weight:600;}
.ob{width:20px;height:20px;border-radius:50%;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:.63rem;font-weight:800;flex-shrink:0;color:var(--ink3);transition:all .15s;margin-top:1px;}
.opt.sel .ob{background:var(--accent);border-color:var(--accent);color:#fff;}
.sawrap{display:flex;flex-direction:column;gap:8px;}
.sahint{font-size:.72rem;color:var(--ink3);padding:7px 11px;background:var(--sf2);border-radius:var(--r);border:1px dashed var(--rule);}

.sainput:focus{border-color:var(--accent);}
.sainput.v{border-color:var(--accent);}
/* Submit bar */
.subbar{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--rule);padding:10px 20px;display:flex;justify-content:center;z-index:100;}
.subbtn{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:12px 0;font-size:.9rem;font-weight:700;max-width:400px;width:100%;transition:opacity .15s;}
.subbtn:disabled{opacity:.35;cursor:not-allowed;}
.subbtn:not(:disabled):hover{opacity:.88;}
/* Result */
.result{animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ring-wrap{text-align:center;padding:24px 0 16px;}
.ring-sub{font-size:.75rem;color:var(--ink3);margin-top:10px;}
.grade-badge{display:inline-flex;align-items:center;padding:5px 18px;border-radius:4px;font-size:.88rem;font-weight:800;margin-top:8px;border:1.5px solid;}
.gA{background:var(--ok-lt);color:var(--ok);border-color:var(--ok-bd);}
.gB{background:var(--acc-lt);color:var(--accent);border-color:var(--accent);}
.gC{background:var(--warn-lt);color:var(--warn);border-color:#C97200;}
.gD{background:var(--ng-lt);color:var(--ng);border-color:var(--ng-bd);}
.rmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 24px;}
.rm{background:var(--sf);border:1px solid var(--rule);border-radius:var(--r);padding:13px;text-align:center;}
.rm-v{font-size:1.2rem;font-weight:800;font-variant-numeric:tabular-nums;}
.rm-l{font-size:.66rem;color:var(--ink3);margin-top:2px;}
.rev-hd{font-size:.75rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.rev-hd::after{content:'';flex:1;height:1px;background:var(--rule);}
.rq{background:var(--sf);border:1px solid var(--rule);border-radius:var(--r);padding:16px;margin-bottom:8px;}
.rq.ok{border-color:var(--ok-bd);}
.rq.ng{border-color:var(--ng-bd);}
.rq-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.rq-n{font-size:.66rem;color:var(--ink3);font-weight:600;}
.rq-badge{padding:2px 8px;border-radius:3px;font-size:.65rem;font-weight:700;}
.rq-badge.ok{background:var(--ok-lt);color:var(--ok);}
.rq-badge.ng{background:var(--ng-lt);color:var(--ng);}
.rq-q{font-size:.83rem;font-weight:600;color:var(--ink);margin-bottom:9px;line-height:1.5;}
.rq-ans{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;}
.rq-y{padding:5px 11px;border-radius:4px;font-size:.75rem;border:1px solid;}
.rq-y.ok{background:var(--ok-lt);border-color:var(--ok-bd);color:var(--ok);}
.rq-y.ng{background:var(--ng-lt);border-color:var(--ng-bd);color:var(--ng);}
.rq-c{padding:5px 11px;border-radius:4px;font-size:.75rem;background:var(--ok-lt);border:1px solid var(--ok-bd);color:var(--ok);}
.rq-exp{font-size:.74rem;color:var(--ink2);line-height:1.65;padding:8px 12px;background:var(--sf2);border-radius:var(--r);}
.ract{display:flex;gap:10px;margin-top:24px;}
.btn-retry{flex:1;background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:12px;font-size:.86rem;font-weight:700;transition:opacity .15s;}
.btn-retry:hover{opacity:.88;}
.btn-home{flex:1;background:none;border:1px solid var(--rule);border-radius:var(--r);padding:12px;font-size:.86rem;color:var(--ink2);transition:all .15s;}
.btn-home:hover{border-color:var(--accent);color:var(--accent);}
</style>

<script>
/* ── 테마 ── */
var TH=['auto','light','dark'];
function applyTheme(t){
  t==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',t);
  var b=document.getElementById('thbtn');
  if(b)b.textContent=t==='auto'?'테마':t==='light'?'☀ 라이트':'☾ 다크';
}
function toggleTheme(){
  var i=(TH.indexOf(localStorage.getItem('xth')||'auto')+1)%3;
  localStorage.setItem('xth',TH[i]);applyTheme(TH[i]);
}
applyTheme(localStorage.getItem('xth')||'auto');

/* ── 데이터 ── */
var TESTS=[
  {id:'t1',title:'기초 용어 마스터',diff:1,dLbl:'입문',desc:'LTV·DSR·PIR·전세가율·갭투자 등 필수 부동산 용어 완전 정복',time:'5분',cat:'기초'},
  {id:'t2',title:'세금 완전 정복',diff:1,dLbl:'입문',desc:'취득세·양도세·종부세·재산세 — 세금 체계 기초부터 정확히',time:'5분',cat:'세금'},
  {id:'t3',title:'시장 지표 읽기',diff:2,dLbl:'초급',desc:'KB지수·전세가율·PIR·K-HAI·낙찰가율 실전 시장 분석',time:'7분',cat:'시장'},

  {id:'t8',title:'거시경제 연계',diff:4,dLbl:'고급',desc:'금리·인플레이션·인구·환율·가계부채가 부동산에 미치는 영향',time:'12분',cat:'경제'},
  {id:'t9',title:'재건축·재개발',diff:4,dLbl:'고급',desc:'정비사업 절차·권리산정·비례율·분담금·안전진단 실전',time:'12분',cat:'재건축'},
  {id:'t10',title:'종합 마스터',diff:5,dLbl:'전문가',desc:'전 영역 통합 — 계산+정책+시장+역사 최고난도 복합 문제',time:'15분',cat:'종합'}
];

var QS={
t1:[
  {tp:'mc',q:'LTV(주택담보인정비율)의 정확한 계산식은?',
   opts:['대출액 ÷ 담보주택 감정평가액 × 100','연소득 ÷ 연 원리금 합계 × 100','전세가 ÷ 매매가 × 100','연소득 ÷ 주택가격 × 100'],
   ans:0,exp:'LTV = 대출액 ÷ 주택 감정평가액 × 100. 예) 6억 주택에 4.2억 대출이면 LTV 70%. 투기과열지구는 40%, 조정지역은 60~70%, 비규제는 70~80%가 기본 상한입니다.'},
  {tp:'mc',q:'DSR(총부채원리금상환비율) 40% 규제의 정확한 의미는?',

   ans:0,exp:'DSR·LTV 강화는 대출 가능 금액을 줄여 매수력을 직접 억제합니다. 저금리·공급 절벽·높은 전세가율은 모두 가격 상승 요인. 10·15 대책의 스트레스 DSR 3% 하한이 상승 억제의 핵심 도구입니다.'},
  {tp:'mc',q:'자기자본 3억 원으로 10억 아파트 매수(7억 대출), 1년 후 12억에 매각 시 자기자본수익률(ROE, 이자·세금 단순화)은?',
   opts:['약 67%','20%','약 200%','30%'],
   ans:0,exp:'매각이익 = 12억 - 10억 = 2억. ROE = 2억 ÷ 자기자본 3억 = 66.7% ≈ 67%. 총자본수익률(2억÷10억=20%)보다 훨씬 높음. 레버리지의 수익 증폭 효과. 실제로는 이자·취득세·양도세가 차감됩니다.'},
  {tp:'mc',q:'DSR과 LTV의 핵심 차이는?',
   opts:['LTV = 담보가치 기준 한도, DSR = 소득 기준 상환 능력. 두 기준 모두 충족해야 대출 가능','DSR만 주담대에 적용','LTV가 DSR보다 항상 강한 규제','둘 다 동일한 방식으로 계산'],
   ans:0,exp:'LTV: 집값 기준으로 최대 얼마까지 빌릴 수 있나(담보 측면). DSR: 소득 기준으로 갚을 능력이 있나(상환 능력 측면). 두 기준 모두 충족해야 대출 가능. 어느 쪽이든 더 낮은 값이 실질 한도.'},
  {tp:'mc',q:'10·15 대책 + DSR 3단계(2026.7)가 동시 시행될 때 가장 큰 타격을 받는 유형은?',
   opts:['중간 소득(5~8천만)·중간 가격대(10~20억) 대출 의존 실수요자','초고소득 현금 부자','저소득 소형 주택 실수요자','법인 부동산 투자자'],
   ans:0,exp:'초고소득·현금 자산가는 대출 의존도 낮아 영향 제한. 저소득층은 이미 대출 한도가 낮음. 중간 소득·중간 가격대(10~20억)를 대출로 매수하려는 40대 실수요자가 이중 규제의 최대 피해 계층.'},
  {tp:'mc',q:'장기 고정금리 모기지가 차주에게 가장 유리한 상황은?',
   opts:['향후 금리 상승이 예상될 때(금리 저점에서 고정 체결)','금리가 지속 하락할 것이 확실할 때','단기 2년 이내 매각 예정일 때','소득이 일시적으로 낮을 때'],
   ans:0,exp:'고정금리: 금리 상승 리스크를 완전히 차단. 금리 하락기엔 손해(고금리 유지). 따라서 금리가 저점에 있고 앞으로 오를 것으로 예상될 때 고정금리 선택이 유리. 장기 실거주 계획일 때도 안정적.'},
  {tp:'mc',q:'1세대 다주택자가 세금 부담을 최소화하며 정리하는 전략으로 가장 일반적인 것은?',
   opts:['비조정지역 주택부터 처분 후 최종 1주택으로 비과세(2년 보유+거주) 요건 충족','가격이 가장 낮은 것부터 처분','가격이 가장 높은 것부터 처분','즉시 전부 일괄 처분'],
   ans:0,exp:'다주택자 절세 전략: ①비조정지역(중과 없음) 먼저 매도 → ②조정지역 주택 정리 → ③최종 1주택으로 2년 보유(+거주) 후 12억↓ 비과세 활용. 처분 순서·시기가 세금을 수천만 원 이상 좌우합니다.'},
  {tp:'mc',q:'재건축 초과이익환수 부담금이 가장 많이 줄어드는 경우는?',
   opts:['장기 보유 조합원: 6년 이상 보유 시 최대 70% 감면','소형 평형 선택한 조합원','초과이익이 클수록 자동 감면','재건축 완료 직후 즉시 매각 시'],
   ans:0,exp:'재건축 초과이익환수 감면: 보유 기간 6년↑ 시 최대 70% 감면(누진). 1가구 1주택자(60세↑) 추가 감면. 소형 평형·즉시 매각과는 무관. 장기 보유할수록 환수 부담이 크게 줄어드는 구조.'},
  {tp:'mc',q:'2026~2028년 서울 아파트 가격에 구조적 상승 압력으로 작용하는 요인은?',
   opts:['2024년 서울 착공 역대 최저(약 1.2만호) → 2027~2028년 입주 공백 예고','DSR 3단계 시행으로 수요 억제','다주택자 양도세 중과로 매물 증가','종부세 중과로 보유 부담 증가'],
   ans:0,exp:'2024년 서울 아파트 착공 1.2만호는 역대 최저 수준. 착공 후 입주까지 3~4년 → 2027~2028년 입주 공백 예고. 공급 부족은 가격 지지 요인. 규제 강화에도 불구하고 상승 압력이 지속되는 구조적 배경.'},
  {tp:'sa',q:'연간 임대수입 2,400만, 공실 200만, 운영비 400만, 매입가 12억 원일 때 Cap Rate는 몇 %입니까?',
   hint:'% 단위로 입력 (예: 3.0)',chk:{t:'num',v:1.5}},
  {tp:'sa',q:'비례율 110%, 조합원 종전 자산 4억, 새 아파트 분양가 5억 원일 때 추가분담금은 몇 억 원입니까?',
   hint:'억 단위로 입력 (예: 1.5)',chk:{t:'num',v:0.6}}
]
};

var STARS=['★☆☆☆☆','★★☆☆☆','★★★☆☆','★★★★☆','★★★★★'];
var state={tid:null,ans:{},savals:{}};

/* ── 홈 ── */
function renderHome(){
  var done=JSON.parse(localStorage.getItem('done_2026')||'{}');
  var cnt=Object.keys(done).length;
  var avg=cnt?Math.round(Object.values(done).reduce(function(a,b){return a+b;},0)/cnt):0;
  var html='<div class="hero"><h1>부동산 시험센터<br>2026</h1><p>입문부터 전문가까지 — 난이도별 10단계 테스트로 실력을 확인하세요</p></div>';
  html+='<div class="hstats">';
  html+='<div class="hs"><div class="hs-v">'+cnt+'<span style="font-size:1rem;color:var(--ink3)">/10</span></div><div class="hs-l">완료 테스트</div></div>';
  html+='<div class="hs"><div class="hs-v">100</div><div class="hs-l">총 문제 수</div></div>';
  html+='<div class="hs"><div class="hs-v">'+(cnt?avg+' <span style="font-size:1rem">점</span>':'—')+'</div><div class="hs-l">평균 점수</div></div>';
  html+='</div>';
  html+='<div class="tgrid">';
  TESTS.forEach(function(t,i){
    var s=done[t.id];
    var barColor=['#15803D','#1D4ED8','#A16207','#B91C1C','#6D28D9'][t.diff-1];
    html+='<div class="tc" onclick="startTest(\''+t.id+'\')" style="--bar:'+barColor+';">';
    html+='<style>.tc[onclick*="'+t.id+'"]::after{background:'+barColor+';}</style>';
    html+='<div class="tc-top"><div class="tc-n">TEST '+(i+1)+'</div><span class="db d'+t.diff+'">'+t.dLbl+'</span></div>';
    html+='<div class="tc-title">'+t.title+'</div>';
    html+='<div class="tc-desc">'+t.desc+'</div>';
    html+='<div class="tc-foot"><span class="tc-meta">'+STARS[t.diff-1]+'</span><span class="tc-meta">⏱ '+t.time+'</span><span class="tc-meta">📁 '+t.cat+'</span>';
    if(s!==undefined)html+='<span class="tc-done">✓ '+s+'점</span>';
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('view').innerHTML=html;
}

/* ── 테스트 시작 ── */
function startTest(tid){
  state={tid:tid,ans:{},savals:{}};
  var t=TESTS.find(function(x){return x.id===tid;});
  var qs=QS[tid];
  var html='<div class="th">';
  html+='<div class="th-top"><button class="back" onclick="goHome()">← 홈</button><span class="db d'+t.diff+'">'+t.dLbl+'</span></div>';
  html+='<div class="prog-wrap"><div class="prog" id="pb" style="width:0%"></div></div>';
  html+='<div class="prog-txt"><span id="pc">0 / '+qs.length+' 답변</span><span>'+t.time+'</span></div>';
  html+='<div class="tname-row"><div class="tname">'+t.title+'</div></div>';
  html+='<div class="tsub">'+t.desc+'</div></div>';
  html+='<div class="qlist" id="ql">';
  qs.forEach(function(q,qi){
    html+='<div class="qcard" id="qc'+qi+'">';
    html+='<div class="qnum">문제 '+(qi+1)+' <span class="qnum-badge">'+(q.tp==='mc'?'객관식':'주관식')+'</span></div>';
    html+='<div class="qtxt">'+q.q+'</div>';
    if(q.tp==='mc'){
      html+='<div class="opts">';
      q.opts.forEach(function(o,oi){
        html+='<button class="opt" id="o'+qi+'_'+oi+'" onclick="selOpt(\''+tid+'\','+qi+','+oi+')">';
        html+='<span class="ob">'+'①②③④'[oi]+'</span><span>'+o+'</span></button>';
      });
      html+='</div>';
    } else {
      html+='<div class="sawrap"><div class="sahint">'+q.hint+'</div>';
      html+='<input class="sainput" id="sa'+qi+'" type="text" placeholder="답 입력..." oninput="onSA(\''+tid+'\','+qi+',this.value)" autocomplete="off"></div>';
    }
    html+='</div>';
  });
  html+='</div>';
  document.getElementById('view').innerHTML=html;
  var old=document.querySelector('.subbar');if(old)old.remove();
  var bar=document.createElement('div');bar.className='subbar';
  bar.innerHTML='<button class="subbtn" id="sb" onclick="submitTest()" disabled>채점하기 →</button>';
  document.body.appendChild(bar);
  updateProg();
}

function selOpt(tid,qi,oi){
  state.ans[qi]=oi;
  QS[tid][qi].opts.forEach(function(_,i){var b=document.getElementById('o'+qi+'_'+i);if(b)b.classList.remove('sel');});
  var sel=document.getElementById('o'+qi+'_'+oi);if(sel)sel.classList.add('sel');
  document.getElementById('qc'+qi).classList.add('ans');
  updateProg();
}

function onSA(tid,qi,v){
  if(v.trim())state.savals[qi]=v.trim();else delete state.savals[qi];
  var inp=document.getElementById('sa'+qi);if(inp)inp.classList.toggle('v',!!v.trim());
  document.getElementById('qc'+qi).classList.toggle('ans',!!v.trim());
  updateProg();
}

function updateProg(){
  var qs=QS[state.tid],done=0;
  qs.forEach(function(q,qi){
    if(q.tp==='mc'&&state.ans[qi]!==undefined)done++;
    else if(q.tp==='sa'&&state.savals[qi])done++;
  });
  var pct=Math.round(done/qs.length*100);
  var pb=document.getElementById('pb');if(pb)pb.style.width=pct+'%';
  var pc=document.getElementById('pc');if(pc)pc.textContent=done+' / '+qs.length+' 답변';
  var sb=document.getElementById('sb');if(sb)sb.disabled=done<qs.length;
}

function goHome(){
  var bar=document.querySelector('.subbar');if(bar)bar.remove();
  renderHome();
}

function submitTest(){
  var qs=QS[state.tid],score=0,results=[];
  qs.forEach(function(q,qi){
    var ok=q.tp==='mc'?state.ans[qi]===q.ans:checkSA(q,state.savals[qi]||'');
    if(ok)score+=10;
    results.push({q:q,ok:ok,your:q.tp==='mc'?(state.ans[qi]!==undefined?q.opts[state.ans[qi]]:'미답변'):(state.savals[qi]||'미답변')});
  });
  var bar=document.querySelector('.subbar');if(bar)bar.remove();
  var d=JSON.parse(localStorage.getItem('done_2026')||'{}');
  d[state.tid]=score;localStorage.setItem('done_2026',JSON.stringify(d));
  renderResult(score,results);
}

function checkSA(q,v){
  v=v.trim();if(!v)return false;
  var c=q.chk;
  if(c.t==='num'){var n=parseFloat(v.replace(/,/g,''));return Math.abs(n-c.v)<0.01;}
  if(c.t==='approx'){var n=parseFloat(v.replace(/,/g,''));return Math.abs(n-c.v)<=c.e;}
  if(c.t==='inc'){return c.w.some(function(w){return v.indexOf(w)>-1;});}
  return false;
}

/* ── 결과 ── */
function renderResult(score,results){
  var t=TESTS.find(function(x){return x.id===state.tid;});
  var ok=results.filter(function(r){return r.ok;}).length;
  var grade=score>=90?'A+':score>=80?'A':score>=70?'B+':score>=60?'B':score>=50?'C':score>=40?'C-':'D';
  var gc=score>=70?'gA':score>=50?'gB':score>=40?'gC':'gD';
  var clr=score>=80?'#0A7B4E':score>=60?'#1A56DB':score>=40?'#D97706':'#C8320A';
  var r=54,circ=Math.round(2*Math.PI*r),dash=Math.round(circ*(1-score/100));
  var msg=score>=80?'훌륭합니다! 이 영역을 잘 이해하고 있습니다.':score>=60?'좋습니다. 오답 해설을 확인해 보완하세요.':score>=40?'기초 개념을 다시 학습하면 크게 향상됩니다.':'해당 영역 학습 자료를 먼저 정독한 뒤 재시도하세요.';
  var html='<div class="result">';
  html+='<div class="ring-wrap">';
  html+='<svg width="136" height="136" viewBox="0 0 136 136"><circle cx="68" cy="68" r="'+r+'" fill="none" stroke="var(--rule)" stroke-width="10"/><circle cx="68" cy="68" r="'+r+'" fill="none" stroke="'+clr+'" stroke-width="10" stroke-dasharray="'+circ+'" stroke-dashoffset="'+dash+'" stroke-linecap="round" transform="rotate(-90 68 68)"/><text x="68" y="62" text-anchor="middle" font-size="28" font-weight="800" fill="'+clr+'">'+score+'</text><text x="68" y="78" text-anchor="middle" font-size="11" fill="var(--ink3)">/ 100점</text></svg>';
  html+='<div style="margin-top:8px"><div class="ring-sub">'+t.title+' 결과</div><span class="grade-badge '+gc+'">등급 '+grade+'</span></div>';
  html+='<div style="font-size:.77rem;color:var(--ink3);margin-top:10px;max-width:320px;margin-left:auto;margin-right:auto;">'+msg+'</div></div>';
  html+='<div class="rmeta"><div class="rm"><div class="rm-v" style="color:var(--ok)">'+ok+'문제</div><div class="rm-l">정답</div></div><div class="rm"><div class="rm-v" style="color:var(--ng)">'+(results.length-ok)+'문제</div><div class="rm-l">오답</div></div><div class="rm"><div class="rm-v">'+Math.round(ok/results.length*100)+'%</div><div class="rm-l">정답률</div></div></div>';
  html+='<div class="rev-hd">문제별 해설</div>';
  results.forEach(function(r,i){
    var q=r.q;
    var correct=q.tp==='mc'?q.opts[q.ans]:(q.chk.t==='num'?q.chk.v+'':q.chk.t==='approx'?'약 '+q.chk.v:'"'+q.chk.w.join('/')+'" 포함');
    html+='<div class="rq '+(r.ok?'ok':'ng')+'">';
    html+='<div class="rq-top"><div class="rq-n">문제 '+(i+1)+' · '+(q.tp==='mc'?'객관식':'주관식')+'</div><span class="rq-badge '+(r.ok?'ok':'ng')+'">'+(r.ok?'✓ 정답':'✗ 오답')+'</span></div>';
    html+='<div class="rq-q">'+q.q+'</div>';
    html+='<div class="rq-ans"><div class="rq-y '+(r.ok?'ok':'ng')+'">내 답: '+r.your+'</div>';
    if(!r.ok)html+='<div class="rq-c">정답: '+correct+'</div>';
    html+='</div>';
    if(q.exp)html+='<div class="rq-exp">💡 '+q.exp+'</div>';
    html+='</div>';
  });
  html+='<div class="ract"><button class="btn-retry" onclick="startTest(\''+state.tid+'\')">↺ 다시 풀기</button><button class="btn-home" onclick="goHome()">← 홈으로</button></div>';
  html+='</div>';
  document.getElementById('view').innerHTML=html;
  window.scrollTo(0,0);
}

renderHome();
</script>
</body>
</html>
