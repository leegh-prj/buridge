    desc:'민간택지 분양가 법정 상한. 투기과열지구 내 적용 (서울 25구 + 과천시).',
    fx:[['분양가','택지비+건축비 상한'],['전매','최대 10년'],['실거주','2~3년 의무'],['청약','가점제 75%↑']],
    names: new Set(SEOUL25.concat(['과천시']))
  }
};

/* 행정 중심 좌표 + 반경 (서클 즉시 표시용) */
var AREAS = [
  /* ─ 서울 25구 ─ */
  {n:'종로구',p:'서울',lat:37.5906,lng:126.9780,r:1200},
  {n:'중구',p:'서울',lat:37.5596,lng:126.9975,r:900},
  {n:'용산구',p:'서울',lat:37.5302,lng:126.9652,r:1400},
  {n:'성동구',p:'서울',lat:37.5564,lng:127.0375,r:1300},
  {n:'광진구',p:'서울',lat:37.5447,lng:127.0826,r:1200},
  {n:'동대문구',p:'서울',lat:37.5744,lng:127.0394,r:1000},

  {n:'은평구',p:'서울',lat:37.6176,lng:126.9272,r:1700},
  {n:'서대문구',p:'서울',lat:37.5791,lng:126.9368,r:1200},
  {n:'마포구',p:'서울',lat:37.5637,lng:126.9088,r:1500},
  {n:'양천구',p:'서울',lat:37.5170,lng:126.8670,r:1200},
  {n:'강서구',p:'서울',lat:37.5509,lng:126.8496,r:1800},
  {n:'구로구',p:'서울',lat:37.4954,lng:126.8874,r:1200},
  {n:'금천구',p:'서울',lat:37.4601,lng:126.9000,r:900},
  {n:'영등포구',p:'서울',lat:37.5263,lng:126.8963,r:1200},

  {n:'서초구',p:'서울',lat:37.4837,lng:127.0324,r:2000},
  {n:'강남구',p:'서울',lat:37.5172,lng:127.0473,r:1600},
  {n:'송파구',p:'서울',lat:37.5145,lng:127.1059,r:1600},
  {n:'강동구',p:'서울',lat:37.5302,lng:127.1238,r:1500},
  /* ─ 경기 12개 ─ */
  {n:'과천시',p:'경기',lat:37.4288,lng:126.9879,r:2500},

var provMap={};
AREAS.forEach(function(a){provMap[a.n]=a.p;});

/* ── 헬퍼 ──────────────────────────────── */
function inReg(name,key){
  if(key==='all') return Object.keys(REG).some(function(k){return REG[k].names.has(name);});
  return REG[key]&&REG[key].names.has(name);
}
function getClr(name,key){
  if(key==='all') return REG.토허제.names.has(name)?{f:'#448AFF',b:'#0D47A1'}:{f:'#FF5252',b:'#C62828'};
  return{f:REG[key].fill,b:REG[key].color};
}

/* ── Leaflet 초기화 ─────────────────────── */
var map=L.map('map',{center:[36.5,127.5],zoom:7});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:18
}).addTo(map);
var _s=document.createElement('style');
_s.textContent='.map-tip{background:rgba(8,22,48,.92)!important;color:#C8E0FF!important;border:none!important;border-radius:4px!important;font-size:.73rem!important;font-weight:700!important;padding:4px 10px!important;box-shadow:0 2px 8px rgba(0,0,0,.35)!important;white-space:nowrap!important;}';
document.head.appendChild(_s);

var curReg='투기과열',selName=null;
var circleLayer=L.layerGroup().addTo(map);
var polyLayer=L.layerGroup().addTo(map);
var rawGeo=null,hasPolys=false;

/* ── 서클 레이어 (즉시 표시) ───────────── */
function drawCircles(){
  circleLayer.clearLayers();
  AREAS.forEach(function(a){
    if(!inReg(a.n,curReg)) return;
    var c=getClr(a.n,curReg),isSel=selName===a.n;
    var ci=L.circle([a.lat,a.lng],{radius:a.r,color:isSel?'#fff':c.b,weight:isSel?2.5:1.5,fillColor:c.f,fillOpacity:isSel?.72:.50}).addTo(circleLayer);
    var tip=a.n+(a.p!=='서울'?' <small style="opacity:.7">('+a.p+')</small>':'');
    ci.bindTooltip(tip,{sticky:true,className:'map-tip',direction:'auto'});
    (function(area,circle){circle.on('click',function(e){selName=area.n;drawCircles();renderDetail(area.n);L.DomEvent.stopPropagation(e);});})(a,ci);
  });
}

/* ── Overpass → GeoJSON 변환 ──────────── */
function assemble(ways){
  if(!ways||ways.length===0) return[];
  if(ways.length===1) return ways[0];
  var res=ways[0].slice(),rem=ways.slice(1),tol=1e-5,tries=0;
  while(rem.length>0&&tries++<rem.length*3+10){
    var last=res[res.length-1],found=false;
    for(var i=0;i<rem.length;i++){
      var w=rem[i],f=w[0],l=w[w.length-1];
      if(Math.abs(last[0]-f[0])<tol&&Math.abs(last[1]-f[1])<tol){res=res.concat(w.slice(1));rem.splice(i,1);found=true;break;}
      if(Math.abs(last[0]-l[0])<tol&&Math.abs(last[1]-l[1])<tol){res=res.concat(w.slice(0,-1).reverse());rem.splice(i,1);found=true;break;}
    }
    if(!found&&rem.length>0) res=res.concat(rem.shift());
  }
  return res;
}
function toGeoJSON(data){
  var feats=[];
  (data.elements||[]).forEach(function(el){
    if(el.type!=='relation'||!el.tags) return;
    var name=el.tags.name||'';if(!name) return;
    var outer=[];
    (el.members||[]).forEach(function(m){
      if(m.type==='way'&&(m.role==='outer'||m.role==='')&&m.geometry&&m.geometry.length>=2)
        outer.push(m.geometry.map(function(g){return[g.lon,g.lat];}));
    });
    if(outer.length===0) return;
    var ring=assemble(outer);if(ring.length<3) return;
    if(ring[0][0]!==ring[ring.length-1][0]||ring[0][1]!==ring[ring.length-1][1]) ring.push(ring[0]);
    feats.push({type:'Feature',properties:{name:name},geometry:{type:'Polygon',coordinates:[ring]}});
  });
  return{type:'FeatureCollection',features:feats};
}

/* ── Overpass 로드 ──────────────────────── */
function loadOverpass(){
  var el=document.getElementById('sts');el.classList.add('on');
  /* 서울 25구 — 서울 bbox */
  var seoulNames='종로구|중구|용산구|성동구|광진구|동대문구|중랑구|성북구|강북구|도봉구|노원구|은평구|서대문구|마포구|양천구|강서구|구로구|금천구|영등포구|동작구|관악구|서초구|강남구|송파구|강동구';
  /* 경기 12개 — bbox로 타 지역 서구 등과 구분 */
  var gg12uni='과천시|광명시|의왕시|하남시';          /* 고유 명칭 */
  var gg12sub='분당구|수정구|중원구|영통구|장안구|팔달구|동안구|수지구'; /* 구 단위 */
  /* 광주 군공항 토허제 */
  var gjUni='광산구|나주시|장성군|화순군';

  var q='[out:json][timeout:30];('
    +'relation["boundary"="administrative"]["name"~"^('+seoulNames+')$"](37.42,126.77,37.71,127.19);'
    +'relation["boundary"="administrative"]["name"~"^('+gg12uni+')$"](36.9,126.5,37.7,127.8);'
    +'relation["boundary"="administrative"]["name"~"^('+gg12sub+')$"](36.9,126.5,37.7,127.6);'
    +'relation["boundary"="administrative"]["name"~"^('+gjUni+')$"](34.5,126.4,35.6,127.3);'
    +');out geom qt;';

  var ctrl=new AbortController();
  var tid=setTimeout(function(){ctrl.abort();},30000);
  fetch('https://overpass-api.de/api/interpreter',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:'data='+encodeURIComponent(q),
    signal:ctrl.signal
  })
  .then(function(r){clearTimeout(tid);return r.json();})
  .then(function(data){
    rawGeo=toGeoJSON(data);
    if(rawGeo.features.length>0){hasPolys=true;circleLayer.clearLayers();drawPolygons();}
    el.classList.remove('on');
  })
  .catch(function(){clearTimeout(tid);el.classList.remove('on');/* 서클 유지 */});
}

/* ── 폴리곤 레이어 (Overpass 성공 후) ─── */
function drawPolygons(){
  polyLayer.clearLayers();
  if(!rawGeo) return;
  L.geoJSON(rawGeo,{
    style:function(feat){
      var name=feat.properties.name;
      if(!inReg(name,curReg)) return{fillOpacity:0,color:'#AAB8CC',weight:0.3,opacity:0.4};
      var c=getClr(name,curReg),R=REG[curReg==='all'?'투기과열':curReg];
      var base=R?R.op:.5,isSel=selName===name;
      return{fillColor:c.f,fillOpacity:isSel?Math.min(base+.28,.82):base,color:isSel?'#fff':c.b,weight:isSel?2.5:1.2,opacity:.9};
    },
    onEachFeature:function(feat,layer){
      var name=feat.properties.name;
      layer.bindTooltip(name,{sticky:true,className:'map-tip',direction:'auto'});
      if(!inReg(name,'all')) return;
      layer.on('mouseover',function(){
        if(selName!==name){var R=REG[curReg==='all'?'투기과열':curReg];layer.setStyle({fillOpacity:Math.min((R?R.op:.5)+.15,.72)});}
      });
      layer.on('mouseout',function(){
        if(selName!==name){var R=REG[curReg==='all'?'투기과열':curReg];layer.setStyle({fillOpacity:R?R.op:.5});}
      });
      layer.on('click',function(e){selName=name;drawPolygons();renderDetail(name);L.DomEvent.stopPropagation(e);});
    }
  }).addTo(polyLayer);
}

/* ── 상세 패널 ──────────────────────────── */
function renderDetail(name){
  var prov=provMap[name]||'';
  var html='<div class="dn">'+name+'</div><div class="ds">'+prov+'</div>';
  var any=false;
  Object.keys(REG).forEach(function(k){
    if(!inReg(name,k)) return;any=true;
    var R=REG[k],dong=R.dong?R.dong[name]:null;
    html+='<div class="rc" style="background:'+R.fill+'22;border-color:'+R.color+'55">'
      +'<div class="rr"><div class="rd" style="background:'+R.color+'"></div>'
      +'<span class="rl" style="color:'+R.color+'">'+R.label+'</span></div>'
      +'<div class="rp">'+R.desc+'</div>'
      +(dong?'<div class="rg" style="color:'+R.color+'">▸ '+dong+'</div>':'')+'</div>';
  });
  if(!any) html+='<p style="font-size:.72rem;color:#68839C;margin-top:8px">현재 규제 미지정입니다.</p>';
  var CR=REG[curReg];
  if(CR&&inReg(name,curReg)&&CR.fx){
    html+='<div class="eh">'+CR.label+'</div>';
    CR.fx.forEach(function(f){html+='<div class="er"><span class="ek">'+f[0]+'</span><span>'+f[1]+'</span></div>';});
  }
  document.getElementById('det').innerHTML=html;
}

/* ── 레이어 전환 ─────────────────────────── */
function setReg(key,btn){
  curReg=key;selName=null;
  document.querySelectorAll('.rb').forEach(function(b){b.classList.remove('on');b.style.background='';b.style.color='';});
  btn.classList.add('on');
  var cols={투기과열:'#C62828',조정지역:'#E65100',토허제:'#0D47A1',분상제:'#6A1B9A',all:'#546E7A'};
  btn.style.background=cols[key]||'#546E7A';btn.style.color='#fff';
  document.getElementById('det').innerHTML='<div class="det-empty">지도에서 색칠된 지역을 클릭하세요.</div>';
  if(hasPolys) drawPolygons(); else drawCircles();
  renderLegend();
}

/* ── 범례 ────────────────────────────────── */
function renderLegend(){
  var el=document.getElementById('leg');
  if(curReg==='all'){
    el.innerHTML='<b style="font-size:.62rem;color:#374F6B;display:block;margin-bottom:6px">전체 레이어</b>'
      +'<div class="lr"><div class="lb" style="background:#FF5252"></div>투기과열·조정·분상제</div>'
      +'<div class="lr"><div class="lb" style="background:#448AFF"></div>토허제 (서울·경기·광주)</div>'
      +'<div class="lr"><div class="lb" style="background:#E8ECF4"></div>미지정</div>';
  } else {
    var R=REG[curReg];
    var cnt={투기과열:'서울25+경기12',조정지역:'서울25+경기12',토허제:'서울25+경기12+광주',분상제:'서울25+과천'};
    el.innerHTML='<b style="font-size:.62rem;color:#374F6B;display:block;margin-bottom:6px">'+R.label+'</b>'
      +'<div class="lr"><div class="lb" style="background:'+R.fill+'"></div>'+(cnt[curReg]||'')+'</div>'
      +'<div class="lr"><div class="lb" style="background:#E8ECF4"></div>미지정</div>';
  }
}

/* ── 시작 ──────────────────────────────── */
(function(){
  var fb=document.querySelector('[data-k="투기과열"]');
  if(fb){fb.style.background='#C62828';fb.style.color='#fff';}
  renderLegend();
  drawCircles();   /* 즉시 표시 */
  loadOverpass();  /* 백그라운드에서 실제 경계 */
})();
</script>
