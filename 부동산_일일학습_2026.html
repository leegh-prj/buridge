<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2e3248;
  --text: #e8eaf0;
  --text2: #9aa0bc;
  --accent: #4f8ef7;
  --accent2: #7c5af0;
  --green: #2ecc71;
  --orange: #f39c12;
  --red: #e74c3c;
  --yellow: #f1c40f;
  --radius: 12px;
  --font: Pretendard Variable, Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Apple SD Gothic Neo, Malgun Gothic, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f0f2f8;
    --surface: #ffffff;
    --surface2: #e8ecf5;
    --border: #d0d6e8;
    --text: #1a1d2e;
    --text2: #5a6282;
  }
}
:root[data-theme="light"] {
  --bg: #f0f2f8; --surface: #ffffff; --surface2: #e8ecf5;
  --border: #d0d6e8; --text: #1a1d2e; --text2: #5a6282;
}
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
  --border: #2e3248; --text: #e8eaf0; --text2: #9aa0bc;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.logo a { color: var(--text); text-decoration: none; }
.logo span { color: var(--accent); }
.hdr-right { display: flex; align-items: center; gap: 16px; }
.streak-badge {
  background: linear-gradient(135deg, #f39c12, #e74c3c);
  color: #fff; font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px;
}
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text2); padding: 6px 12px; border-radius: 8px;
  cursor: pointer; font-size: 12px; transition: all .2s;
}
.theme-btn:hover { color: var(--text); border-color: var(--accent); }
.back-btn {
  color: var(--text2); text-decoration: none; font-size: 13px;
  display: flex; align-items: center; gap: 4px;
}
.back-btn:hover { color: var(--accent); }

/* MAIN LAYOUT */
main { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }

/* DATE NAV */
.date-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px;
}
.nav-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); padding: 8px 16px; border-radius: 8px;
  cursor: pointer; font-size: 13px; transition: all .2s;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn:disabled { opacity: .35; cursor: not-allowed; }
.date-center { text-align: center; }
.date-label { font-size: 13px; color: var(--text2); margin-bottom: 2px; }
.date-big { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.lesson-num { font-size: 12px; color: var(--text2); margin-top: 2px; }
.today-btn {
  margin-top: 6px; background: none; border: 1px solid var(--accent);
  color: var(--accent); padding: 3px 12px; border-radius: 999px;
  font-size: 11px; font-weight: 700; cursor: pointer;
}
.today-btn[hidden] { display: none; }

/* 같은 날짜의 강의가 여러 개일 때 선택 탭 */
.day-picks {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed var(--border);
}
.day-picks-lab { font-size: 12px; font-weight: 700; color: var(--text2); margin-right: 4px; }
.day-pick {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text2);
  padding: 6px 12px; border-radius: 999px; font-size: 12px; cursor: pointer;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  transition: all .15s;
}
.day-pick:hover { border-color: var(--accent); color: var(--accent); }
.day-pick.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.next-lesson-btn {
  margin-top: 10px; background: none; border: 1px solid var(--accent); color: var(--accent);
  padding: 10px 18px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%;
}
.hdr-right .theme-btn, .hdr-right .back-btn, .streak-badge, .logo span { white-space: nowrap; }
@media (max-width: 480px) { .nb-txt { display: none; } }
.kbd-hint { font-size: 11px; color: var(--text2); text-align: center; margin-top: 18px; opacity: .7; }
.kbd-hint kbd {
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 5px; font-family: inherit; font-size: 10px;
}
@media (hover: none) { .kbd-hint { display: none; } }

/* LESSON CARD */
.lesson-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.lesson-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.cat-chip {
  font-size: 11px; font-weight: 700; padding: 3px 10px;
  border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.lesson-title { font-size: 21px; font-weight: 800; line-height: 1.3; margin-bottom: 5px; }
.lesson-sub { font-size: 13px; color: var(--text2); }

/* SECTIONS */
.section { padding: 22px 24px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: none; }
.sec-label {
  font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text2); margin-bottom: 14px;
}
.concept-text { font-size: 16px; line-height: 1.9; color: var(--text); }
.concept-text strong { color: var(--accent); }

/* FORMULA BOX */
.formula-box {
  background: var(--surface2);
  border-left: 3px solid var(--accent2);
  border-radius: 0 8px 8px 0;
  padding: 16px 20px;
  margin: 14px 0;
  font-family: 'Courier New', monospace;
  font-size: 15px;
  line-height: 1.7;
}
.formula-box .f-title { font-size: 11px; color: var(--text2); margin-bottom: 8px; font-family: var(--font); font-weight: 700; letter-spacing: .05em; }

/* EXAMPLE STEPS */
.example-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px 20px;
  margin-top: 14px;
}
.example-title { font-size: 12px; font-weight: 700; color: var(--orange); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.step { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
.step-num {
  background: var(--accent); color: #fff;
  font-size: 11px; font-weight: 700;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
}
.step-text { font-size: 15px; line-height: 1.7; }
.step-text em { color: var(--green); font-style: normal; font-weight: 700; }
.result-box {
  background: linear-gradient(135deg, rgba(79,142,247,.12), rgba(124,90,240,.12));
  border: 1px solid rgba(79,142,247,.3);
  border-radius: 8px; padding: 13px 16px; margin-top: 12px;
  font-size: 15px; font-weight: 600;
}

/* TIP BOX */
.tip-box {
  background: rgba(241,196,15,.08);
  border: 1px solid rgba(241,196,15,.25);
  border-radius: 8px; padding: 14px 16px;
  font-size: 14px; line-height: 1.75;
  display: flex; gap: 10px; align-items: flex-start;
}
.tip-icon { font-size: 16px; flex-shrink: 0; }

/* CHECKLIST */
.checklist-box { display: flex; flex-direction: column; gap: 5px; }
.checklist-item {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 14px; line-height: 1.75; color: var(--text2); padding: 2px 0;
}
.cl-check {
  flex-shrink: 0; width: 18px; height: 18px; border-radius: 4px;
  border: 1.5px solid var(--accent); display: flex; align-items: center;
  justify-content: center; margin-top: 3px; color: var(--accent); font-size: 11px;
}

/* QUIZ */
.quiz-box { }
.quiz-q { font-size: 15.5px; font-weight: 700; margin-bottom: 16px; line-height: 1.65; color: var(--text); }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 9px; padding: 12px 16px;
  font-size: 14px; cursor: pointer; transition: all .18s;
  text-align: left; color: var(--text); line-height: 1.55;
  display: flex; align-items: flex-start; gap: 8px;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); background: rgba(79,142,247,.09); color: var(--text); }
.quiz-opt.correct { background: rgba(46,204,113,.13) !important; border-color: var(--green) !important; color: var(--green) !important; font-weight: 600; }
.quiz-opt.wrong { background: rgba(231,76,60,.09) !important; border-color: var(--red) !important; color: var(--red) !important; }
.quiz-opt:disabled { cursor: not-allowed; }
.quiz-explain {
  margin-top: 14px; padding: 14px 16px;
  background: var(--surface2); border-radius: 9px; border-left: 3px solid var(--accent);
  font-size: 14px; line-height: 1.8; display: none;
}
.quiz-explain.show { display: block; }

/* DONE BUTTON */
.done-wrap { padding: 20px 24px; }
.done-btn {
  width: 100%; padding: 14px;
  border-radius: 10px; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all .2s;
}
.done-btn.undone {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
}
.done-btn.undone:hover { opacity: .9; transform: translateY(-1px); }
.done-btn.done-state {
  background: rgba(46,204,113,.15);
  border: 1px solid var(--green);
  color: var(--green);
  cursor: default;
}

/* CALENDAR */
.cal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-title { font-size: 15px; font-weight: 700; }
.cal-stat { font-size: 12px; color: var(--text2); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.cal-dow {
  font-size: 10px; font-weight: 700; color: var(--text2);
  text-align: center; padding: 4px 0;
  letter-spacing: .05em;
}
.cal-day {
  aspect-ratio: 1;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .15s;
  border: 1px solid transparent;
}
.cal-day.empty { background: transparent; cursor: default; }
.cal-day.future { background: var(--surface2); color: var(--text2); cursor: default; }
.cal-day.past-done { background: rgba(46,204,113,.2); border-color: rgba(46,204,113,.4); color: var(--green); }
.cal-day.past-miss { background: var(--surface2); color: var(--text2); opacity: .5; }
.cal-day.today { background: var(--accent); color: #fff; font-weight: 800; }
.cal-day.today.done-today { background: var(--green); }
.cal-day:not(.empty):not(.future):hover { border-color: var(--accent); }

/* STATS ROW */
.stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stat-val { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat-lab { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* COLORS BY CATEGORY */
.cat-market  { background: rgba(52,152,219,.15); color: #3498db; }
.cat-finance { background: rgba(155,89,182,.15); color: #9b59b6; }
.cat-tax     { background: rgba(231,76,60,.15); color: #e74c3c; }
.cat-rebuild { background: rgba(39,174,96,.15); color: #27ae60; }
.cat-invest  { background: rgba(241,196,15,.15); color: #d4a017; }
.cat-law     { background: rgba(52,73,94,.3); color: #8e9fc5; }
.cat-eval    { background: rgba(230,126,34,.15); color: #e67e22; }

@media (max-width: 600px) {
  main { padding: 20px 12px 60px; }
  .lesson-header { flex-direction: column; }
  .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-val { font-size: 20px; }
}

/* SEARCH */
.search-wrap { position: relative; margin-bottom: 20px; }
.search-input {
  width: 100%; box-sizing: border-box;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 12px 38px 12px 42px;
  font-size: 15px; color: var(--text); font-family: inherit;
  outline: none; transition: border-color .2s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text2); }
.search-icon {
  position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
  font-size: 16px; pointer-events: none; opacity: .55;
}
.search-clear {
  position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--text2); font-size: 20px;
  cursor: pointer; padding: 2px 6px; line-height: 1; display: none; border-radius: 4px;
}
.search-clear:hover { color: var(--text); background: var(--surface2); }

/* SEARCH RESULTS PANEL */
.sp-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 8px;
}
.sp-meta-txt { font-size: 13px; color: var(--text2); }
.sp-meta-txt strong { color: var(--accent); }
.sp-back {
  background: none; border: 1.5px solid var(--border); border-radius: 8px;
  color: var(--text2); font-size: 12px; padding: 6px 14px; cursor: pointer; font-family: inherit;
  transition: all .15s;
}
.sp-back:hover { background: var(--surface2); color: var(--text); border-color: var(--accent); }
.sp-list { display: flex; flex-direction: column; gap: 10px; }
.sp-card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 18px 16px;
  cursor: pointer; transition: border-color .18s, background .18s;
}
.sp-card:hover { border-color: var(--accent); background: var(--surface2); }
.sp-card-meta { font-size: 11px; color: var(--text2); margin-bottom: 7px; display: flex; align-items: center; gap: 6px; font-weight: 600; }
.sp-card-title { font-size: 16px; font-weight: 800; color: var(--text); margin-bottom: 3px; line-height: 1.35; }
.sp-card-sub { font-size: 12px; color: var(--text2); margin-bottom: 10px; }
.sp-card-snip {
  font-size: 12px; color: var(--text2); line-height: 1.65;
  border-left: 2px solid var(--border); padding-left: 10px;
}
.sp-card-title mark, .sp-card-snip mark {
  background: rgba(79,142,247,.2); color: var(--accent); border-radius: 2px; padding: 0 2px;
}
.sp-empty {
  text-align: center; padding: 48px 20px; color: var(--text2); line-height: 2; font-size: 14px;
}
/* 강의 본문 표 (| a | b | 마크다운) */
.md-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 10px 0 12px; }
.md-table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.55; white-space: normal; }
.md-table th, .md-table td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
.md-table th { background: var(--surface2); color: var(--text); font-weight: 700; white-space: nowrap; }
.md-table td { color: var(--text); }
.md-table tr:nth-child(even) td { background: rgba(127,127,127,.06); }
@media (max-width: 520px) { .md-table { font-size: 13px; } .md-table th, .md-table td { padding: 6px 7px; } }
</style>
</head>

      <button class="nav-btn" id="btnNext" onclick="goDay(1)" title="다음 날짜 (→)" disabled>다음 →</button>
    </div>

    <!-- Lesson Card -->
    <div class="lesson-card" id="lessonCard">
      <!-- injected by JS -->
    </div>

    <!-- Calendar -->
    <div class="cal-card">
      <div class="cal-header">
        <div class="cal-title" id="calMonth"></div>
        <div class="cal-stat" id="calStat"></div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="kbd-hint"><kbd>←</kbd> <kbd>→</kbd> 날짜 이동 · <kbd>/</kbd> 검색 · <kbd>Esc</kbd> 검색 닫기</div>
  </div>
</main>

<script src="lessons.js"></script>
<script>
// 강의 본문 마크다운: **굵게** + | a | b | 표 (첫 줄 = 머리글, |---| 구분선은 건너뜀)
// pre=true면 줄바꿈을 <br>로 바꾸지 않음(white-space:pre-wrap 영역용)
function mdRender(src, strongTpl, pre) {
  const bold = t => t.replace(/\*\*(.+?)\*\*/g, strongTpl);
  const isRow = l => /^\s*\|.*\|\s*$/.test(l);
  const isSep = l => /^\s*\|(\s*:?-{2,}:?\s*\|)+\s*$/.test(l);
  const cells = l => l.trim().slice(1, -1).split('|').map(c => bold(c.trim()));
  const lines = String(src).split('\n');
  const out = [];
  let text = [];
  const flushText = () => {
    if (text.length) out.push(text.map(bold).join(pre ? '\n' : '<br>'));
    text = [];
  };
  for (let i = 0; i < lines.length; i++) {
    if (!isRow(lines[i])) { text.push(lines[i]); continue; }
    const rows = [];
    while (i < lines.length && isRow(lines[i])) { if (!isSep(lines[i])) rows.push(cells(lines[i])); i++; }
    while (i < lines.length && !lines[i].trim()) i++;  // 표 뒤 빈 줄 생략
    i--;
    while (text.length && !text[text.length - 1].trim()) text.pop();  // 표 앞 빈 줄 생략
    flushText();
    const [head, ...body] = rows;
    out.push('<div class="md-table-wrap"><table class="md-table"><thead><tr>' + head.map(c => '<th>' + c + '</th>').join('') +
      '</tr></thead><tbody>' + body.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
  }
  flushText();
  return out.join('');
}

// ─── STATE ───────────────────────────────────────────────────────────────────
const TODAY = new Date();
const todayStr = dayKey(TODAY);  // 로컬 날짜 기준 (UTC 변환 시 한국 오전 9시 전에는 전날이 됨)
let viewDate = new Date(TODAY);
let viewPick = null;  // 같은 날짜에 강의가 여러 개일 때 선택한 강의 index
let currentKey = null;  // 지금 보고 있는 강의의 학습 상태 키
let state = {};

function loadState() {
  try { state = JSON.parse(localStorage.getItem('reEduState') || '{}'); }
  catch { state = {}; }
  state.done = state.done || {};
  state.quizResults = state.quizResults || {};
  state.lastDate = state.lastDate || null;
}
function saveState() {
  localStorage.setItem('reEduState', JSON.stringify(state));
}

// 날짜별 강의 고정 (특정 날짜에 특정 강의 표시)
function dayKey(d) {
  if (typeof d === 'string') return d;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// 날짜별 기본 강의: date 필드가 있는 날은 그날 첫 강의, 없는 날은 1월 1일부터 순서대로 순환
const FIRST_LESSON_ON = {};
LESSONS.forEach((l, i) => { if (l.date && !(l.date in FIRST_LESSON_ON)) FIRST_LESSON_ON[l.date] = i; });
function getLessonIndex(d) {
  const dk = dayKey(d);
  if (dk in FIRST_LESSON_ON) return FIRST_LESSON_ON[dk];
  const base = new Date('2026-01-01');
  const diff = Math.floor((new Date(dk) - base) / 86400000);
  return ((diff % LESSONS.length) + LESSONS.length) % LESSONS.length;
}

function lessonLabel(lesson, idx) {
  return lesson.num ? `${lesson.num}강` : `강의 #${idx + 1}`;
}
// 그 날짜의 기본 강의 + 같은 날짜(date 필드)로 추가된 강의들
function lessonsOnDate(dk) {
  const base = getLessonIndex(dk);
  const list = [base];
  LESSONS.forEach((l, i) => { if (l.date === dk && i !== base) list.push(i); });
  return list.sort((a, b) => a - b);
}
// 기본 강의는 날짜 키, 추가 강의는 '날짜~강의번호' 키로 학습 상태 저장
function stateKey(dk, idx) {
  return idx === getLessonIndex(dk) ? dk : `${dk}~${LESSONS[idx].num || idx + 1}`;
}
function lessonForKey(k) {
  const [dk, n] = k.split('~');
  if (n === undefined) return LESSONS[getLessonIndex(dk)];
  return LESSONS.find(l => String(l.num) === n);
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function formatDate(d) {
  const ds = dayKey(d);
  const dt = new Date(ds + 'T00:00:00');
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const days = ['일','월','화','수','목','금','토'];
  return `${dt.getFullYear()}년 ${months[dt.getMonth()]} ${dt.getDate()}일 (${days[dt.getDay()]})`;
}

function renderLesson() {
  const dk = dayKey(viewDate);
  const dayList = lessonsOnDate(dk);
  const idx = (viewPick !== null && dayList.includes(viewPick)) ? viewPick : getLessonIndex(dk);
  const lesson = LESSONS[idx];
  const sk = stateKey(dk, idx);
  currentKey = sk;
  const isDone = !!state.done[sk];
  const nextInDay = dayList.find(i => i !== idx && !state.done[stateKey(dk, i)]);
  const isToday = dk === todayStr;
  const isFuture = dk > todayStr;

  document.getElementById('dateDisplay').textContent = formatDate(viewDate);
  document.getElementById('lessonNum').textContent = `${lessonLabel(lesson, idx)} · 전체 ${LESSONS.length}개 강의`;
  document.getElementById('btnToday').hidden = isToday;
  document.getElementById('btnPrev').disabled = false;
  document.getElementById('btnNext').disabled = isToday || isFuture;

  const catColors = {
    market: 'cat-market', finance: 'cat-finance', tax: 'cat-tax',
    rebuild: 'cat-rebuild', invest: 'cat-invest', law: 'cat-law', eval: 'cat-eval'
  };

  // C-3: 구조가 다른 강의(93강+) 방어 처리
  const catClass = catColors[lesson.cat] || 'cat-market';
  const catLabel = lesson.catLabel || lesson.category || '';
  const subText = lesson.sub || '';

  // C-1: text 필드(93강+ 신규 구조) 우선 렌더링 — **bold**·표 마크다운 처리
  const conceptBody = lesson.text
    ? mdRender(lesson.text, '<strong style="color:var(--text);font-weight:700">$1</strong>')
    : (lesson.concept || '');
  const conceptSub = (lesson.text && lesson.concept)
    ? `<p style="color:var(--ink2);font-style:italic;margin-bottom:14px;font-size:.88rem;border-left:3px solid var(--accent);padding-left:10px;line-height:1.6">${lesson.concept}</p>`
    : '';

  const qDone = state.quizResults[sk];

  // 공식/예시/팁이 문자열일 수도, 객체일 수도 있으므로 양쪽 처리
  const formulaHTML = (lesson.formula && typeof lesson.formula === 'object' && lesson.formula.lines)
    ? `<div class="f-title">${lesson.formula.title || ''}</div>${lesson.formula.lines.map(l => `<div>${l}</div>`).join('')}`
    : `<pre style="white-space:pre-wrap;font-size:13px;line-height:1.7;font-family:inherit">${lesson.formula || ''}</pre>`;

  const exampleHTML = (lesson.example && typeof lesson.example === 'object' && lesson.example.steps)
    ? `<div class="example-title">${lesson.example.title || ''}</div>
       ${lesson.example.steps.map((s, i) => `
         <div class="step">
           <div class="step-num">${i+1}</div>
           <div class="step-text">${s}</div>
         </div>`).join('')}
       <div class="result-box">📌 ${lesson.example.result || ''}</div>`
    : `<div style="white-space:pre-wrap;font-size:13px;line-height:1.7">${mdRender(lesson.example || '', '<strong>$1</strong>', true)}</div>`;

  const tipHTML = (typeof lesson.tip === 'string')
    ? mdRender(lesson.tip, '<strong>$1</strong>')
    : '';

  const checklistHTML = lesson.checklist
    ? lesson.checklist.trim().split('\n').filter(l => l.trim()).map(l =>
        `<div class="checklist-item"><div class="cl-check">□</div><div>${l.replace(/^□\s*/, '')}</div></div>`).join('')
    : '';

  const pickHTML = dayList.length > 1 ? `
    <div class="day-picks" role="tablist" aria-label="이 날의 강의">
      <span class="day-picks-lab">📚 이 날의 강의 ${dayList.length}개</span>
      ${dayList.map(i => `<button class="day-pick ${i === idx ? 'on' : ''}" role="tab" aria-selected="${i === idx}"
        title="${LESSONS[i].title.replace(/"/g, '&quot;')}" onclick="pickLesson(${i})">${state.done[stateKey(dk, i)] ? '✅ ' : ''}${lessonLabel(LESSONS[i], i)} · ${LESSONS[i].title.split(' — ')[0]}</button>`).join('')}
    </div>` : '';

  document.getElementById('lessonCard').innerHTML = `
    ${pickHTML}
    <div class="lesson-header">
      <div>
        <div class="lesson-title">${lesson.title}</div>
        ${subText ? `<div class="lesson-sub">${subText}</div>` : ''}
      </div>
      <span class="cat-chip ${catClass}">${catLabel}</span>
    </div>

    <div class="section">
      <div class="sec-label">개념 설명</div>
      <div class="concept-text">${conceptSub}${conceptBody}</div>
    </div>

    <div class="section">
      <div class="sec-label">핵심 공식</div>
      <div class="formula-box">${formulaHTML}</div>
    </div>

    <div class="section">
      <div class="sec-label">실전 예시</div>
      <div class="example-box">${exampleHTML}</div>
    </div>

    <div class="section">
      <div class="sec-label">학습 팁</div>
      <div class="tip-box">
        <div class="tip-icon">💡</div>
        <div>${tipHTML}</div>
      </div>
    </div>

    ${checklistHTML ? `<div class="section">
      <div class="sec-label">실전 체크리스트</div>
      <div class="checklist-box">${checklistHTML}</div>
    </div>` : ''}

    <div class="section">
      <div class="sec-label">오늘의 퀴즈</div>
      <div class="quiz-box">
        <div class="quiz-q">${lesson.quiz.q}</div>
        <div class="quiz-options" id="quizOpts">
          ${lesson.quiz.opts.map((o, i) => `
            <button class="quiz-opt ${qDone !== undefined ? (i === lesson.quiz.ans ? 'correct' : (i === qDone && qDone !== lesson.quiz.ans ? 'wrong' : '')) : ''}"
              onclick="answerQuiz(${i}, ${lesson.quiz.ans}, '${sk}')"
              ${qDone !== undefined ? 'disabled' : ''}>
              ${String.fromCharCode(9312 + i)} ${o}
            </button>
          `).join('')}
        </div>
        <div class="quiz-explain ${qDone !== undefined ? 'show' : ''}" id="quizExplain">
          ${qDone === lesson.quiz.ans ? '✅ 정답입니다! ' : '❌ 오답입니다. '}${lesson.quiz.explain}
        </div>
      </div>
    </div>

    <div class="done-wrap">
      <button class="done-btn ${isDone ? 'done-state' : 'undone'}"
        onclick="${isDone ? '' : 'markDone()'}"
        ${isDone ? 'disabled' : ''}>
        ${isDone ? '✅ 학습 완료!' : '학습 완료 체크하기'}
      </button>
      ${isDone && nextInDay !== undefined ? `<button class="next-lesson-btn" onclick="pickLesson(${nextInDay})">
        이 날의 다음 강의: ${lessonLabel(LESSONS[nextInDay], nextInDay)} →</button>` : ''}
    </div>
  `;

  renderStats();
  renderCalendar();
}

function answerQuiz(selected, correct, dk) {
  state.quizResults[dk] = selected;
  saveState();
  renderLesson();
}

function markDone() {
  state.done[currentKey] = true;
  state.lastDate = dayKey(viewDate);
  saveState();
  renderLesson();
}

function goDay(delta) {
  const d = new Date(viewDate);
  d.setDate(d.getDate() + delta);
  const limitDate = new Date('2026-01-01');
  if (d > TODAY || d < limitDate) return;
  viewDate = d;
  viewPick = null;
  renderLesson();
}

function pickLesson(i) {
  viewPick = i;
  renderLesson();
  document.getElementById('lessonCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function goToday() {
  viewDate = new Date(TODAY);
  viewPick = null;
  renderLesson();
}

// ─── STATS ───────────────────────────────────────────────────────────────────
function calcStreak() {
  let streak = 0;
  let d = new Date(TODAY);
  // M-2: 오늘 미완료면 어제부터 계산 (즉시 0 방지)
  if (!state.done[todayStr]) d.setDate(d.getDate() - 1);
  while (true) {
    const dk = dayKey(d);
    if (!state.done[dk]) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function renderStats() {
  const streak = calcStreak();
  const total = Object.keys(state.done).length;
  const quizKeys = Object.keys(state.quizResults);
  let correct = 0;
  quizKeys.forEach(k => {
    const l = lessonForKey(k);
    if (l && state.quizResults[k] === l.quiz.ans) correct++;
  });
  const accuracy = quizKeys.length ? Math.round(correct / quizKeys.length * 100) : 0;

  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statQuiz').textContent = accuracy + '%';
  document.getElementById('streakBadge').textContent = `🔥 ${streak}일 연속`;
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function renderCalendar() {
  const now = new Date(TODAY);
  const year = now.getFullYear();
  const month = now.getMonth();
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calMonth').textContent = `${year}년 ${months[month]} 학습 현황`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const doneThisMonth = Object.keys(state.done).filter(k => !k.includes('~') && k.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)).length;
  document.getElementById('calStat').textContent = `이달 ${doneThisMonth}일 완료`;

  const dows = ['일','월','화','수','목','금','토'];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dk = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls = 'cal-day';
    if (dk === todayStr) { cls += ' today'; if (state.done[dk]) cls += ' done-today'; }
    else if (dk > todayStr) cls += ' future';
    else if (state.done[dk]) cls += ' past-done';
    else cls += ' past-miss';
    // M-1: 과거 날짜 클릭 시 해당 날짜로 이동
    const clickable = dk < todayStr ? `onclick="navigateToDate('${dk}')" style="cursor:pointer"` : '';
    html += `<div class="${cls}" title="${dk}" ${clickable}>${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

function navigateToDate(dk) {
  viewDate = new Date(dk + 'T00:00:00');
  viewPick = null;
  renderLesson();
  document.getElementById('lessonCard').scrollIntoView({ behavior: 'smooth' });
}

// ─── SEARCH ──────────────────────────────────────────────────────────────────
let _searchTimer = null;

function _lessonDateMap() {
  const map = {};
  const end = new Date(todayStr + 'T00:00:00');
  let d = new Date('2026-01-01T00:00:00');
  while (d <= end) {
    const dk = dayKey(d);
    const idx = getLessonIndex(dk);
    if (!(idx in map)) map[idx] = dk;
    d.setDate(d.getDate() + 1);
  }
  // 날짜가 지정된 강의는 그 날짜로 연결 (같은 날 추가 강의 포함)
  LESSONS.forEach((l, i) => { if (l.date && l.date <= todayStr) map[i] = l.date; });
  return map;
}

function _flatLesson(lesson) {
  const parts = [
    lesson.title || '', lesson.sub || '', lesson.catLabel || '',
    lesson.text || '', lesson.concept || '', lesson.tip || '', lesson.checklist || '',
    lesson.quiz ? lesson.quiz.q + ' ' + (lesson.quiz.opts || []).join(' ') : '',
    lesson.formula
      ? (typeof lesson.formula === 'object'
          ? (lesson.formula.title || '') + ' ' + (lesson.formula.lines || []).join(' ')
          : lesson.formula)
      : '',
  ];
  return parts.join(' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ');
}

function _hl(text, kw) {
  const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

function _snip(text, kw) {
  const lo = text.toLowerCase();
  const pos = lo.indexOf(kw.toLowerCase());
  if (pos === -1) return text.slice(0, 100) + '…';
  const s = Math.max(0, pos - 35);
  const e = Math.min(text.length, pos + kw.length + 80);
  return (s > 0 ? '…' : '') + text.slice(s, e) + (e < text.length ? '…' : '');
}

function _showSearchMode(on) {
  document.getElementById('searchPanel').style.display = on ? 'block' : 'none';
  document.getElementById('lessonSection').style.display = on ? 'none' : 'block';
}

function onSearch(val) {
  clearTimeout(_searchTimer);
  const clearBtn = document.getElementById('searchClear');
  if (clearBtn) clearBtn.style.display = val ? 'block' : 'none';
  if (!val.trim()) { _showSearchMode(false); return; }
  _searchTimer = setTimeout(() => _runSearch(val.trim()), 220);
}

function _runSearch(kw) {
  const panel = document.getElementById('searchPanel');
  const dateMap = _lessonDateMap();
  const catColors = {
    market:'cat-market', finance:'cat-finance', tax:'cat-tax',
    rebuild:'cat-rebuild', invest:'cat-invest', law:'cat-law', eval:'cat-eval'
  };
  const hits = [];
  LESSONS.forEach((lesson, idx) => {
    if (!(idx in dateMap)) return;
    const flat = _flatLesson(lesson);
    if (flat.toLowerCase().includes(kw.toLowerCase())) hits.push({ idx, lesson, flat, date: dateMap[idx] });
  });

  if (!hits.length) {
    panel.innerHTML = `
      <div class="sp-header">
        <span class="sp-meta-txt"><strong>"${kw}"</strong> 검색 결과 · 0개</span>
        <button class="sp-back" onclick="clearSearch()">← 강의로 돌아가기</button>
      </div>
      <div class="sp-empty">🔎 <strong style="color:var(--accent)">${kw}</strong>에 해당하는 강의가 없어요<br>
      <span style="font-size:12px;opacity:.65">다른 키워드로 검색해 보세요</span></div>`;
  } else {
    const cards = hits.map(({ idx, lesson, flat, date }) => {
      const catClass = catColors[lesson.cat] || 'cat-market';
      const snip = _hl(_snip(flat, kw), kw);
      const title = _hl(lesson.title, kw);
      return `<div class="sp-card" onclick="gotoLesson('${date}', ${idx})">
        <div class="sp-card-meta">
          ${lessonLabel(lesson, idx)}
          <span class="cat-chip ${catClass}" style="font-size:10px;padding:2px 8px;margin:0">${lesson.catLabel || ''}</span>
        </div>
        <div class="sp-card-title">${title}</div>
        ${lesson.sub ? `<div class="sp-card-sub">${lesson.sub}</div>` : ''}
        <div class="sp-card-snip">${snip}</div>
      </div>`;
    }).join('');
    panel.innerHTML = `
      <div class="sp-header">
        <span class="sp-meta-txt"><strong>"${kw}"</strong> 검색 결과 · <strong style="color:var(--accent)">${hits.length}개</strong> 강의 · 학습 순서</span>
        <button class="sp-back" onclick="clearSearch()">← 강의로 돌아가기</button>
      </div>
      <div class="sp-list">${cards}</div>`;
  }
  _showSearchMode(true);
}

function gotoLesson(dateStr, idx) {
  clearSearch();
  viewDate = new Date(dateStr + 'T00:00:00');
  viewPick = (idx === undefined) ? null : idx;
  renderLesson();
  renderCalendar();
  const card = document.getElementById('lessonCard');
  if (card) setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}

function clearSearch() {
  const inp = document.getElementById('searchInput');
  const clr = document.getElementById('searchClear');
  if (inp) inp.value = '';
  if (clr) clr.style.display = 'none';
  _showSearchMode(false);
}

// ─── THEME ───────────────────────────────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const curr = root.getAttribute('data-theme');
  const next = curr === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  // C-2: localStorage에 테마 저장
  localStorage.setItem('buridge-theme', next);
  const btn = document.querySelector('.theme-btn');
  if (btn) btn.textContent = next === 'dark' ? '☀️ 라이트' : '🌙 다크';
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
// C-2: 저장된 테마 복원
(function() {
  const saved = localStorage.getItem('buridge-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  const btn = document.querySelector('.theme-btn');
  if (btn) btn.textContent = saved === 'dark' ? '☀️ 라이트' : '🌙 다크';
})();
// 키보드 단축키: ←/→ 날짜 이동, / 검색, Esc 검색 닫기
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === 'Escape') {
    if (document.getElementById('searchInput').value) clearSearch();
    if (typing) e.target.blur();
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft') goDay(-1);
  else if (e.key === 'ArrowRight' && !document.getElementById('btnNext').disabled) goDay(1);
  else if (e.key === '/') { e.preventDefault(); document.getElementById('searchInput').focus(); }
});

loadState();
renderLesson();

// ?lesson=176 (강의 번호) 또는 ?lesson=i1 (번호 없는 초기 강의 순서)로 특정 강의 바로 열기 — 정책 모음 등에서 연결
(() => {
  let ref = null;
  try { ref = new URLSearchParams(location.search).get('lesson'); } catch (e) {}
  if (!ref) return;
  const idx = /^i\d+$/.test(ref) ? +ref.slice(1) : LESSONS.findIndex(l => String(l.num) === ref);
  const date = LESSONS[idx] && _lessonDateMap()[idx];
  if (date) gotoLesson(date, idx);
})();
</script>
<script src="news-popup.js" defer></script>
</body>
