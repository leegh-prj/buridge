<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2e3248;
  --text: #e8eaf0;
  --text2: #9aa0bc;
  --accent: #4f8ef7;
  --accent2: #7c5af0;
  --green: #2ecc71;
  --orange: #f39c12;
  --red: #e74c3c;
  --yellow: #f1c40f;
  --radius: 12px;
  --font: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f0f2f8;
    --surface: #ffffff;
    --surface2: #e8ecf5;
    --border: #d0d6e8;
    --text: #1a1d2e;
    --text2: #5a6282;
  }
}
:root[data-theme="light"] {
  --bg: #f0f2f8; --surface: #ffffff; --surface2: #e8ecf5;
  --border: #d0d6e8; --text: #1a1d2e; --text2: #5a6282;
}
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
  --border: #2e3248; --text: #e8eaf0; --text2: #9aa0bc;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.logo a { color: var(--text); text-decoration: none; }
.logo span { color: var(--accent); }
.hdr-right { display: flex; align-items: center; gap: 16px; }
.streak-badge {
  background: linear-gradient(135deg, #f39c12, #e74c3c);
  color: #fff; font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 4px;
}
.theme-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text2); padding: 6px 12px; border-radius: 8px;
  cursor: pointer; font-size: 12px; transition: all .2s;
}
.theme-btn:hover { color: var(--text); border-color: var(--accent); }
.back-btn {
  color: var(--text2); text-decoration: none; font-size: 13px;
  display: flex; align-items: center; gap: 4px;
}
.back-btn:hover { color: var(--accent); }

/* MAIN LAYOUT */
main { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }

/* DATE NAV */
.date-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 28px;
}
.nav-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text2); padding: 8px 16px; border-radius: 8px;
  cursor: pointer; font-size: 13px; transition: all .2s;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn:disabled { opacity: .35; cursor: not-allowed; }
.date-center { text-align: center; }
.date-label { font-size: 13px; color: var(--text2); margin-bottom: 2px; }
.date-big { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.lesson-num { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* LESSON CARD */
.lesson-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 20px;
}
.lesson-header {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.cat-chip {
  font-size: 11px; font-weight: 700; padding: 3px 10px;
  border-radius: 20px; white-space: nowrap; flex-shrink: 0;
}
.lesson-title { font-size: 20px; font-weight: 800; line-height: 1.3; margin-bottom: 4px; }
.lesson-sub { font-size: 13px; color: var(--text2); }

/* SECTIONS */
.section { padding: 20px 24px; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: none; }
.sec-label {
  font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--text2); margin-bottom: 12px;
}
.concept-text { font-size: 15px; line-height: 1.8; color: var(--text); }
.concept-text strong { color: var(--accent); }

/* FORMULA BOX */
.formula-box {
  background: var(--surface2);
  border-left: 3px solid var(--accent2);
  border-radius: 0 8px 8px 0;
  padding: 14px 18px;
  margin: 12px 0;
  font-family: 'Courier New', monospace;
  font-size: 14px;
  line-height: 1.6;
}
.formula-box .f-title { font-size: 11px; color: var(--text2); margin-bottom: 6px; font-family: var(--font); font-weight: 700; letter-spacing: .05em; }

/* EXAMPLE STEPS */
.example-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 18px;
  margin-top: 12px;
}
.example-title { font-size: 12px; font-weight: 700; color: var(--orange); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
.step { display: flex; gap: 10px; margin-bottom: 8px; align-items: flex-start; }
.step-num {
  background: var(--accent); color: #fff;
  font-size: 11px; font-weight: 700;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
}
.step-text { font-size: 14px; line-height: 1.6; }
.step-text em { color: var(--green); font-style: normal; font-weight: 700; }
.result-box {
  background: linear-gradient(135deg, rgba(79,142,247,.12), rgba(124,90,240,.12));
  border: 1px solid rgba(79,142,247,.3);
  border-radius: 8px; padding: 12px 16px; margin-top: 12px;
  font-size: 14px; font-weight: 600;
}

/* TIP BOX */
.tip-box {
  background: rgba(241,196,15,.08);
  border: 1px solid rgba(241,196,15,.25);
  border-radius: 8px; padding: 12px 16px;
  font-size: 13px; line-height: 1.6;
  display: flex; gap: 10px; align-items: flex-start;
}
.tip-icon { font-size: 16px; flex-shrink: 0; }

/* QUIZ */
.quiz-box { }
.quiz-q { font-size: 15px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px; padding: 12px 16px;
  font-size: 14px; cursor: pointer; transition: all .2s;
  text-align: left; color: var(--text);
}
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); background: rgba(79,142,247,.08); }
.quiz-opt.correct { background: rgba(46,204,113,.12) !important; border-color: var(--green) !important; color: var(--green) !important; }
.quiz-opt.wrong { background: rgba(231,76,60,.08) !important; border-color: var(--red) !important; color: var(--red) !important; }
.quiz-opt:disabled { cursor: not-allowed; }
.quiz-explain {
  margin-top: 14px; padding: 12px 16px;
  background: var(--surface2); border-radius: 8px;
  font-size: 13px; line-height: 1.6; display: none;
}
.quiz-explain.show { display: block; }

/* DONE BUTTON */
.done-wrap { padding: 20px 24px; }
.done-btn {
  width: 100%; padding: 14px;
  border-radius: 10px; border: none;
  font-size: 15px; font-weight: 700; cursor: pointer;
  transition: all .2s;
}
.done-btn.undone {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff;
}
.done-btn.undone:hover { opacity: .9; transform: translateY(-1px); }
.done-btn.done-state {
  background: rgba(46,204,113,.15);
  border: 1px solid var(--green);
  color: var(--green);
  cursor: default;
}

/* CALENDAR */
.cal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
}
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.cal-title { font-size: 15px; font-weight: 700; }
.cal-stat { font-size: 12px; color: var(--text2); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.cal-dow {
  font-size: 10px; font-weight: 700; color: var(--text2);
  text-align: center; padding: 4px 0;
  letter-spacing: .05em;
}
.cal-day {
  aspect-ratio: 1;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all .15s;
  border: 1px solid transparent;
}
.cal-day.empty { background: transparent; cursor: default; }
.cal-day.future { background: var(--surface2); color: var(--text2); cursor: default; }
.cal-day.past-done { background: rgba(46,204,113,.2); border-color: rgba(46,204,113,.4); color: var(--green); }
.cal-day.past-miss { background: var(--surface2); color: var(--text2); opacity: .5; }
.cal-day.today { background: var(--accent); color: #fff; font-weight: 800; }
.cal-day.today.done-today { background: var(--green); }
.cal-day:not(.empty):not(.future):hover { border-color: var(--accent); }

/* STATS ROW */
.stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stat-val { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stat-lab { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* COLORS BY CATEGORY */
.cat-market  { background: rgba(52,152,219,.15); color: #3498db; }
.cat-finance { background: rgba(155,89,182,.15); color: #9b59b6; }
.cat-tax     { background: rgba(231,76,60,.15); color: #e74c3c; }
.cat-rebuild { background: rgba(39,174,96,.15); color: #27ae60; }
.cat-invest  { background: rgba(241,196,15,.15); color: #d4a017; }
.cat-law     { background: rgba(52,73,94,.3); color: #8e9fc5; }
.cat-eval    { background: rgba(230,126,34,.15); color: #e67e22; }

@media (max-width: 600px) {
  main { padding: 20px 12px 60px; }
  .lesson-header { flex-direction: column; }
  .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-val { font-size: 20px; }
}
</style>
</head>

<script>
// ─── LESSON BANK (116 lessons) ────────────────────────────────────────────
const LESSONS = [
  {
    cat: 'market', catLabel: '시장동향',
    title: '서울 아파트 가격, 어떻게 읽나요?',
    sub: '실거래가지수 vs 호가 vs KB시세 차이 이해',
    concept: `부동산 가격을 나타내는 지표는 크게 세 가지입니다. <strong>실거래가지수</strong>는 국토교통부에 신고된 실제 거래 가격의 변동을 추적합니다. <strong>KB시세</strong>는 KB국민은행이 중개사 설문으로 조사하는 시장 추정가입니다. <strong>호가(呼價)</strong>는 집주인이 원하는 가격으로, 실거래가와 차이가 클 수 있습니다.

2026년 7월 현재, 서울 아파트 주간 매매가격 상승률은 <strong>+0.27%</strong>로 상승세가 이어지고 있습니다(연누계 +5.42%). 화성 동탄은 6.30 토허제 신규 지정 이후에도 +1.29%를 기록하며 강세를 보입니다.`,
    formula: { title: '가격 변동률 계산', lines: ['변동률(%) = (이번주 지수 − 전주 지수) ÷ 전주 지수 × 100', '예) 113.2 → 113.54: (113.54−113.2)/113.2 × 100 = +0.30%'] },
    example: {
      title: '📊 실전 예시: 서울 아파트 지수 읽기',
      steps: [
        '한국부동산원 주간 아파트가격 동향 확인 (매주 목요일 발표)',
        '서울 매매 지수가 113.20 → 113.54로 변동',
        '변동률 = (113.54 − 113.20) ÷ 113.20 × 100',
        '계산: 0.34 ÷ 113.20 × 100 = <em>+0.30%</em>'
      ],
      result: '주간 +0.30% = 연율 환산 시 약 +15.6% 수준의 상승 속도'
    },
    tip: '💡 KB시세는 매매·전세 모두 있어요. 주택담보대출 LTV 계산 시 KB시세가 기준이 되므로 반드시 체크하세요.',
    quiz: {
      q: '다음 중 금융기관이 주택담보대출 한도 계산 시 기준으로 사용하는 지표는?',
      opts: ['국토부 실거래가', 'KB시세', '호가', '공시지가'],
      ans: 1,
      explain: 'KB국민은행 시세(KB시세)가 금융기관의 LTV 계산 기준으로 사용됩니다. 공시지가는 세금 기준, 실거래가는 세금 신고 기준이에요.'
    }
  },
  {
    cat: 'finance', catLabel: '대출·금융',
    title: 'LTV·DTI·DSR — 대출 3총사 완전 정복',
    sub: '내 대출 한도를 결정하는 핵심 지표 이해',
    concept: `주택담보대출 한도는 세 가지 규제 비율이 동시에 적용됩니다. <strong>LTV(주택담보대출비율)</strong>는 집값 대비 대출 한도입니다. <strong>DTI(총부채상환비율)</strong>는 연 소득 대비 원리금 상환 비율입니다. <strong>DSR(총부채원리금상환비율)</strong>은 모든 대출 원리금의 합산 비율로 가장 까다로운 규제입니다.

2026년 현재, <strong>스트레스 DSR 3단계</strong>가 적용되어 스트레스 금리 3%가 가산됩니다. 서울 투기지역은 LTV 40%, DSR 40%가 원칙입니다.`,
    formula: { title: '3가지 비율 공식', lines: ['LTV = 대출금액 ÷ 주택가격 × 100', 'DTI = 연간 원리금 상환액 ÷ 연소득 × 100', 'DSR = 모든 대출 연간 원리금 ÷ 연소득 × 100'] },
    example: {
      title: '🏦 실전 예시: 10억 아파트 대출 한도 계산',
      steps: [
        '주택가격: 10억원 / 연소득: 8,000만원 / 기존 신용대출 없음',
        'LTV 40% 적용: 최대 대출 4억원',
        'DSR 40% 적용: 연간 원리금 한도 = 8,000만 × 40% = 3,200만원',
        '30년 만기, 금리 4% 가정 시 월 상환 약 191만원 → 연 2,292만원',
        'DSR 기준 가능 대출: <em>약 4.8억원</em> → LTV 4억이 더 낮아 최종 4억'
      ],
      result: '최종 대출 한도: 4억원 (LTV 규제가 바인딩)'
    },
    tip: '💡 스트레스 DSR 3단계에서는 실제 금리에 3%를 더한 가산 금리로 DSR을 계산합니다. 금리 4%이면 7%로 계산해 한도가 대폭 줄어요.',
    quiz: {
      q: '연소득 6,000만원인 직장인이 DSR 40% 규제를 받을 때, 연간 최대 원리금 상환 가능액은?',
      opts: ['1,200만원', '2,000만원', '2,400만원', '3,000만원'],
      ans: 2,
      explain: 'DSR 40% = 6,000만원 × 40% = 2,400만원이 연간 원리금 상환 한도입니다. 월 200만원 수준이에요.'
    }
  },
  {
    cat: 'tax', catLabel: '세금·세제',

투자자가 봐야 할 진짜 신호:

    quiz: {

      opts: ['지수 계산 방식이 틀렸다', '강남3구는 이미 하락 전환했는데 외곽 상승이 전체 지수를 유지시키는 양극화 구조다', '85주가 최장 기록이 아니다', '연속 상승은 반드시 매수 신호이다'],

  },
  {
    id: 116,
    category: '금융·시장 이해',
    title: '긴급 바이백이란 무엇인가 — 정부의 채권시장 개입 완전 이해',
    keywords: ['바이백', '채권시장', '정부개입', '국고채', '시장안정'],
    concept: `2026년 9월 29일, 이형일 부총재가 긴급 발표를 했습니다.

[바이백의 효과]
① 직접 효과: 국채금리 하락 → 주담대·회사채 금리 안정
② 간접 효과: "정부가 지킨다"는 신뢰 → 투자심리 안정 (구두 효과)

    formula: {

        '↓',

        '국고채 시장에서 직접 매입 (수요 창출)',

        '채권 가격 ↑ = 금리 ↓',
        '↓',
        '주담대 금리 안정 → 부동산 시장 충격 완화',
      ]
    },

9.28: 국고채 10년 4.542% (+15bp) — 2022년 이후 최고
9.29 오전: 이형일 부총재 "긴급 바이백" 구두개입
9.29 종가:
· 코스피 -0.27% (전날 -1.88%에서 진정)
· 원달러 1,356.7원 (원화 강세)
· 국고채 금리: 추가 급등 차단 (4.1%대 유지)

실제 바이백이 실행되면 추가 안정 기대.`,
    tip: `바이백 관련 뉴스 나오면 부동산 투자자가 체크할 것:

2. 기간 (일회성 vs 지속)
3. 미 국채금리 방향 (5% 이상 유지 시 효과 제한)

부동산 시장에 미치는 영향:
· 단기: 주담대 금리 추가 상승 차단 → 구매력 유지
· 중기: 금리 안정 확인 후 매수 심리 회복 가능
· 주의: 바이백은 지연 효과일 뿐 — 금리 방향 자체를 바꾸지는 못함

2022년 영국 사례: 트러스 쇼크 → BOE 바이백 → 일시 안정 → 근본 원인 미해결로 결국 총리 사임`,
    quiz: {
      q: '정부가 긴급 바이백을 실시할 때 국채 금리는 어떻게 변하는가?',
      opts: ['금리가 상승한다 (채권 가격 하락)', '금리가 하락한다 (채권 가격 상승)', '금리에 변화가 없다', '장기금리만 상승하고 단기금리는 하락한다'],
      ans: 1,
      explain: '바이백은 정부가 시장에서 국채를 매입하는 것입니다. 매입 수요가 증가하면 채권 가격이 오르고, 채권 가격과 금리는 역방향이므로 금리가 하락합니다. 이를 통해 주담대·기업대출 등 시중 금리 전반의 추가 상승을 차단하는 효과가 있습니다.'
    }
  }
];

// ─── STATE ───────────────────────────────────────────────────────────────────
const TODAY = new Date();
const todayStr = TODAY.toISOString().slice(0,10);
let viewDate = new Date(TODAY);
let state = {};

function loadState() {
  try { state = JSON.parse(localStorage.getItem('reEduState') || '{}'); }
  catch { state = {}; }
  state.done = state.done || {};
  state.quizResults = state.quizResults || {};
  state.lastDate = state.lastDate || null;
}
function saveState() {
  localStorage.setItem('reEduState', JSON.stringify(state));
}

// 날짜별 강의 고정 (특정 날짜에 특정 강의 표시)
const DATE_LESSON_OVERRIDES = {
  '2026-09-07': LESSONS.length - 24,  // 93강: 기업형 임대주택 완전 정복
  '2026-09-08': LESSONS.length - 23,  // 94강: 9월 1주 시장 리포트
  '2026-09-09': LESSONS.length - 22,  // 95강: 아크로리버파크 -9.1억 해부
  '2026-09-10': LESSONS.length - 20,  // 97강: 강남 -0.13% 낙폭 축소 — 바닥 신호 판별
  '2026-09-15': LESSONS.length - 18,  // 99강: 추석 연휴와 부동산 시장
  '2026-09-16': LESSONS.length - 16,  // 101강: 연준 금리 인상과 내 주담대
  '2026-09-17': LESSONS.length - 14,  // 103강: 강남3구 완전 동반 하락 — 바닥인가, 추세 전환인가?
  '2026-09-18': LESSONS.length - 12,  // 105강: 연준 25bp 인상 확정 — 워시 시대 통화정책
  '2026-09-21': LESSONS.length - 10,  // 107강: 10월 분양시장 완전 가이드
  '2026-09-22': LESSONS.length - 8,   // 109강: 금리 인상에도 주가가 오른다 — 삼각관계
  '2026-09-23': LESSONS.length - 6,   // 111강: 거래량 급감에도 가격이 오른다 — 서울 아파트 역설
  '2026-09-28': LESSONS.length - 4,   // 113강: 채권 패닉이란 무엇인가 — 미 10년물 5.2%
  '2026-09-29': LESSONS.length - 2,   // 115강: 서울 아파트 85주 연속 상승의 의미
};

function dayKey(d) {
  return (typeof d === 'string') ? d : d.toISOString().slice(0,10);
}
function getLessonIndex(d) {
  const dk = dayKey(d);
  if (DATE_LESSON_OVERRIDES[dk] !== undefined) return DATE_LESSON_OVERRIDES[dk];
  const base = new Date('2026-01-01');
  const diff = Math.floor((new Date(dk) - base) / 86400000);
  return ((diff % LESSONS.length) + LESSONS.length) % LESSONS.length;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function formatDate(d) {
  const ds = dayKey(d);
  const dt = new Date(ds + 'T00:00:00');
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const days = ['일','월','화','수','목','금','토'];
  return `${dt.getFullYear()}년 ${months[dt.getMonth()]} ${dt.getDate()}일 (${days[dt.getDay()]})`;
}

function renderLesson() {
  const dk = dayKey(viewDate);
  const idx = getLessonIndex(dk);
  const lesson = LESSONS[idx];
  const isDone = !!state.done[dk];
  const isToday = dk === todayStr;
  const isFuture = dk > todayStr;

  document.getElementById('dateDisplay').textContent = formatDate(viewDate);
  document.getElementById('lessonNum').textContent = `강의 #${idx + 1} / ${LESSONS.length}`;
  document.getElementById('btnPrev').disabled = false;
  document.getElementById('btnNext').disabled = isToday || isFuture;

  const catColors = {
    market: 'cat-market', finance: 'cat-finance', tax: 'cat-tax',
    rebuild: 'cat-rebuild', invest: 'cat-invest', law: 'cat-law', eval: 'cat-eval'
  };

  const qDone = state.quizResults[dk];

  // 공식/예시/팁이 문자열일 수도, 객체일 수도 있으므로 양쪽 처리
  const formulaHTML = (lesson.formula && typeof lesson.formula === 'object' && lesson.formula.lines)
    ? `<div class="f-title">${lesson.formula.title || ''}</div>${lesson.formula.lines.map(l => `<div>${l}</div>`).join('')}`
    : `<pre style="white-space:pre-wrap;font-size:13px;line-height:1.7;font-family:inherit">${lesson.formula || ''}</pre>`;

  const exampleHTML = (lesson.example && typeof lesson.example === 'object' && lesson.example.steps)
    ? `<div class="example-title">${lesson.example.title || ''}</div>
       ${lesson.example.steps.map((s, i) => `
         <div class="step">
           <div class="step-num">${i+1}</div>
           <div class="step-text">${s}</div>
         </div>`).join('')}
       <div class="result-box">📌 ${lesson.example.result || ''}</div>`
    : `<pre style="white-space:pre-wrap;font-size:13px;line-height:1.7;font-family:inherit">${lesson.example || ''}</pre>`;

  const tipHTML = (typeof lesson.tip === 'string')
    ? lesson.tip.replace(/\n/g, '<br>')
    : '';

  document.getElementById('lessonCard').innerHTML = `
    <div class="lesson-header">
      <div>
        <div class="lesson-title">${lesson.title}</div>
        <div class="lesson-sub">${lesson.sub}</div>
      </div>
      <span class="cat-chip ${catColors[lesson.cat]}">${lesson.catLabel}</span>
    </div>

    <div class="section">
      <div class="sec-label">개념 설명</div>
      <div class="concept-text">${lesson.concept}</div>
    </div>

    <div class="section">
      <div class="sec-label">핵심 공식</div>
      <div class="formula-box">${formulaHTML}</div>
    </div>

    <div class="section">
      <div class="sec-label">실전 예시</div>
      <div class="example-box">${exampleHTML}</div>
    </div>

    <div class="section">
      <div class="sec-label">학습 팁</div>
      <div class="tip-box">
        <div class="tip-icon">💡</div>
        <div>${tipHTML}</div>
      </div>
    </div>

    <div class="section">
      <div class="sec-label">오늘의 퀴즈</div>
      <div class="quiz-box">
        <div class="quiz-q">${lesson.quiz.q}</div>
        <div class="quiz-options" id="quizOpts">
          ${lesson.quiz.opts.map((o, i) => `
            <button class="quiz-opt ${qDone !== undefined ? (i === lesson.quiz.ans ? 'correct' : (i === qDone && qDone !== lesson.quiz.ans ? 'wrong' : '')) : ''}"
              onclick="answerQuiz(${i}, ${lesson.quiz.ans}, '${dk}')"
              ${qDone !== undefined ? 'disabled' : ''}>
              ${String.fromCharCode(9312 + i)} ${o}
            </button>
          `).join('')}
        </div>
        <div class="quiz-explain ${qDone !== undefined ? 'show' : ''}" id="quizExplain">
          ${qDone === lesson.quiz.ans ? '✅ 정답입니다! ' : '❌ 오답입니다. '}${lesson.quiz.explain}
        </div>
      </div>
    </div>

    <div class="done-wrap">
      <button class="done-btn ${isDone ? 'done-state' : 'undone'}"
        onclick="${isDone ? '' : 'markDone()'}"
        ${isDone ? 'disabled' : ''}>
        ${isDone ? '✅ 오늘 학습 완료!' : '학습 완료 체크하기'}
      </button>
    </div>
  `;

  renderStats();
  renderCalendar();
}

function answerQuiz(selected, correct, dk) {
  state.quizResults[dk] = selected;
  saveState();
  renderLesson();
}

function markDone() {
  const dk = dayKey(viewDate);
  state.done[dk] = true;
  state.lastDate = dk;
  saveState();
  renderLesson();
}

function goDay(delta) {
  const d = new Date(viewDate);
  d.setDate(d.getDate() + delta);
  if (d > TODAY) return;
  viewDate = d;
  renderLesson();
}

// ─── STATS ───────────────────────────────────────────────────────────────────
function calcStreak() {
  let streak = 0;
  let d = new Date(TODAY);
  while (true) {
    const dk = dayKey(d);
    if (!state.done[dk]) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function renderStats() {
  const streak = calcStreak();
  const total = Object.keys(state.done).length;
  const quizKeys = Object.keys(state.quizResults);
  let correct = 0;
  quizKeys.forEach(k => {
    const idx = getLessonIndex(k);
    if (state.quizResults[k] === LESSONS[idx].quiz.ans) correct++;
  });
  const accuracy = quizKeys.length ? Math.round(correct / quizKeys.length * 100) : 0;

  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statQuiz').textContent = accuracy + '%';
  document.getElementById('streakBadge').textContent = `🔥 ${streak}일 연속`;
}

// ─── CALENDAR ─────────────────────────────────────────────────────────────────
function renderCalendar() {
  const now = new Date(TODAY);
  const year = now.getFullYear();
  const month = now.getMonth();
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calMonth').textContent = `${year}년 ${months[month]} 학습 현황`;

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const doneThisMonth = Object.keys(state.done).filter(k => k.startsWith(`${year}-${String(month+1).padStart(2,'0')}`)).length;
  document.getElementById('calStat').textContent = `이달 ${doneThisMonth}일 완료`;

  const dows = ['일','월','화','수','목','금','토'];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dk = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let cls = 'cal-day';
    if (dk === todayStr) { cls += ' today'; if (state.done[dk]) cls += ' done-today'; }
    else if (dk > todayStr) cls += ' future';
    else if (state.done[dk]) cls += ' past-done';
    else cls += ' past-miss';
    html += `<div class="${cls}" title="${dk}">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

// ─── THEME ───────────────────────────────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const curr = root.getAttribute('data-theme');
  root.setAttribute('data-theme', curr === 'dark' ? 'light' : 'dark');
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadState();
renderLesson();
</script>
</body>
</html>
