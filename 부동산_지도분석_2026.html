<style>

  --a:#0A5C2A;  --a-lt:#E4F5EC;
  --bp:#1A4A9A; --bp-lt:#EBF1FF;
  --b:#374F6B;  --b-lt:#E8EDF5;
  --c:#7A5800;  --c-lt:#FFF5D8;
  --d:#5A5A5A;  --d-lt:#F0F0F0;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:var(--font);background:var(--paper);color:var(--ink);height:100%;}

/* 헤더 */
.hd{background:var(--navy);height:50px;display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;}
.hd-back{color:#7AA0C8;font-size:.75rem;text-decoration:none;}.hd-back:hover{color:#C0D8F0;}
.hd-sep{color:#2A4870;}
.hd-title{font-size:.9rem;font-weight:700;color:#D0E0F0;}
.hd-badge{margin-left:auto;font-size:.6rem;font-weight:700;padding:3px 9px;border-radius:3px;background:#081628;border:1px solid #1A3460;color:#3A6090;}

/* 탭 바 */
.tab-bar{background:var(--navy);border-top:1px solid #1A3050;display:flex;padding:0 20px;gap:0;}
.tab{padding:9px 18px;font-size:.76rem;font-weight:700;color:#4A6A90;cursor:pointer;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;}
.tab.active{color:#90C0E0;border-bottom-color:#90C0E0;}

/* 범례 바 */
.legend-bar{background:#0A1830;border-bottom:1px solid #1A3050;padding:7px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:.62rem;}
.lg-item{display:flex;align-items:center;gap:5px;color:#6A8AAA;}
.lg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;}
.lg-sep{color:#1A3050;margin:0 4px;}

/* 레이아웃 */
.layout{display:flex;height:calc(100vh - 100px);min-height:500px;}
.map-wrap{flex:1;min-width:0;position:relative;overflow:hidden;background:#0D1B2E;}
.panel{width:320px;flex-shrink:0;background:var(--sf);border-left:1px solid var(--rule);overflow-y:auto;display:flex;flex-direction:column;}
@media(max-width:860px){.layout{flex-direction:column;height:auto;}.panel{width:100%;border-left:none;border-top:1px solid var(--rule);}  .map-wrap{height:55vw;min-height:320px;}}

/* SVG 맵 */
#map-svg{width:100%;height:100%;cursor:default;}
.district{fill:#162840;stroke:#253D60;stroke-width:0.8;cursor:pointer;transition:filter .12s;}
.district:hover{filter:brightness(1.35);stroke:#70A0D0;stroke-width:1.2;}
.district.selected{stroke:#FFD700;stroke-width:1.8;filter:brightness(1.4);}
.d-label{font-family:var(--font);font-size:6.5px;fill:#90B0D0;pointer-events:none;text-anchor:middle;dominant-baseline:central;font-weight:600;}
.d-label.tiny{font-size:5.5px;}

/* 외곽 도시 (수도권) */
.city-bubble{cursor:pointer;transition:opacity .15s;}
.city-bubble:hover{opacity:.85;}
.city-label{font-size:7px;fill:#7AACCC;text-anchor:middle;pointer-events:none;font-weight:600;}

/* 가격 열지도 색상 팔레트 */
/* S: 20억+ */  /* A+: 15-20억 */  /* A: 10-15억 */
/* B+: 8-10억 */ /* B: 6-8억 */  /* C: ~6억 */

/* 패널 */
.panel-top{padding:18px 18px 12px;border-bottom:1px solid var(--rule);background:var(--paper);}
.panel-hint{font-size:.68rem;color:var(--ink3);display:flex;align-items:center;gap:5px;}
.panel-hint::before{content:'←';font-size:.8rem;}

.region-header{padding:16px 18px 10px;border-bottom:1px solid var(--rule);}
.rh-badge{display:inline-flex;align-items:center;gap:5px;font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:3px;margin-bottom:6px;}
.rh-name{font-size:1.1rem;font-weight:900;color:var(--ink);letter-spacing:-.02em;}
.rh-sub{font-size:.67rem;color:var(--ink3);margin-top:2px;}

.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 18px;border-bottom:1px solid var(--rule);}
.kpi{background:var(--paper);border:1px solid var(--rule);border-radius:5px;padding:10px 11px;}
.kpi-v{font-size:1.05rem;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.kpi-l{font-size:.6rem;color:var(--ink3);margin-top:2px;font-weight:500;}
.kpi .up{color:#0A7040;}.kpi .dn{color:#B71C1C;}.kpi .fl{color:var(--ink3);}

.info-block{padding:12px 18px;border-bottom:1px solid var(--rule);}
.ib-ttl{font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:7px;}
.ib-body{font-size:.72rem;color:var(--ink2);line-height:1.75;}
.reg-chip{display:inline-block;font-size:.59rem;font-weight:700;padding:1px 6px;border-radius:3px;margin:1px 2px 1px 0;}
.rc-s{background:#FFE8E8;color:#8B0000;}
.rc-r{background:#EBF1FF;color:#1A4A9A;}
.rc-p{background:#FFF5D8;color:#7A5800;}
.rc-n{background:#F0F0F0;color:#5A5A5A;}

.nearby{display:flex;flex-wrap:wrap;gap:4px;padding:12px 18px;border-bottom:1px solid var(--rule);}
.nb-tag{font-size:.62rem;padding:2px 7px;border-radius:10px;background:var(--blue-lt);color:var(--blue);font-weight:600;}

.hot-list{padding:12px 18px;}
.hot-item{display:flex;align-items:flex-start;gap:6px;padding:5px 0;border-bottom:1px solid #F0F4F8;font-size:.7rem;color:var(--ink2);}
.hot-item:last-child{border-bottom:none;}
.hi-dot{width:6px;height:6px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.hi-up{background:#0A7040;}.hi-dn{background:#B71C1C;}.hi-fl{background:var(--ink3);}

/* 하단 요약 */
.compare-section{background:var(--sf);border-top:1px solid var(--rule);padding:14px 20px;overflow-x:auto;}
.cs-title{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;}
.compare-row{display:flex;gap:0;min-width:600px;}
.cr-item{flex:1;padding:9px 12px;border-right:1px solid var(--rule);position:relative;cursor:pointer;}
.cr-item:last-child{border-right:none;}
.cr-name{font-size:.62rem;font-weight:700;color:var(--ink);}
.cr-price{font-size:.78rem;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;}
.cr-chg{font-size:.6rem;font-weight:700;}
.cr-bar{height:3px;border-radius:1px;margin-top:5px;background:var(--rule);}
.cr-fill{height:100%;border-radius:1px;transition:width .4s;}

/* 등급 색상 매핑 */
.gr-S{background:var(--s);} .gr-Ap{background:#1A6B40;} .gr-A{background:#2A8B50;}
.gr-Bp{background:var(--bp);} .gr-B{background:#374F6B;} .gr-Cp{background:#9A7000;} .gr-C{background:var(--c);} .gr-D{background:var(--d);}

.lg-S{background:var(--s);}
.lg-Ap{background:#1A6B40;}
.lg-A{background:#2A8B50;}
.lg-Bp{background:var(--bp);}
.lg-B{background:#374F6B;}
.lg-C{background:#9A7000;}
.lg-D{background:var(--d);}

.panel-empty{padding:30px 18px;text-align:center;color:var(--ink3);font-size:.75rem;}
</style>

/* ─── SVG 렌더링 ─── */
let curMap = 'seoul';

function buildSeoulSVG() {
  const g = document.getElementById('seoul-map');
  g.innerHTML = '';

  // 투영 함수: [경도, 위도] → SVG [x, y]
  function projS(lon, lat) {
    return [(lon - 126.73) / 0.45 * 680 + 20,
            (37.71 - lat) / 0.28 * 520 + 20];
  }
  function geoPts(poly) {
    return poly.map(([ln, lt]) => {
      const [x, y] = projS(ln, lt);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
  }
  function geoCentroid(poly) {
    let sx = 0, sy = 0;
    poly.forEach(([ln, lt]) => { const [x, y] = projS(ln, lt); sx += x; sy += y; });
    return [sx / poly.length, sy / poly.length];
  }

  // 1. 구별 폴리곤 렌더링
  SEOUL_GEO.forEach(p => {
    const d = REGIONS[p.key];
    if (!d) return;
    const col = GRADE_COLOR[d.grade] || '#1A3050';
    const stk = GRADE_STROKE[d.grade] || '#4A6A90';

    const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    poly.setAttribute('points', geoPts(p.poly));
    poly.setAttribute('fill', col);
    poly.setAttribute('stroke', stk);
    poly.setAttribute('stroke-width', '0.9');
    poly.setAttribute('class', 'district');
    poly.setAttribute('id', 'poly-' + p.key);
    poly.addEventListener('click', () => selectRegion(p.key, 'REGIONS'));
    g.appendChild(poly);
  });

  // 2. 한강 (구 폴리곤 위에 렌더링 — 실제 지리 경로)
  //    N안: 126.793°E→37.580°N 에서 E로 흐르며 127.180°E→37.562°N 으로 NE 굴곡
  //    S안: 대칭으로 약 0.012°lat 낮음
  const riverEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  riverEl.setAttribute('d',
    'M 116,264 Q 172,312 240,352 Q 316,360 428,362 Q 520,374 580,358 L 640,325 L 700,293 ' +
    'L 700,318 L 640,350 Q 580,385 520,399 Q 428,388 316,385 Q 240,378 172,332 L 116,282 Z'
  );
  riverEl.setAttribute('fill', '#1A4A7A');
  riverEl.setAttribute('opacity', '0.82');
  g.appendChild(riverEl);
  addText(g, 340, 374, '한   강', '#3A80B0', 8, '');

  // 3. 구 이름·트렌드 라벨 (한강 위에 렌더링)
  SEOUL_GEO.forEach(p => {
    const d = REGIONS[p.key];
    if (!d) return;
    const [cx, cy] = geoCentroid(p.poly);
    const arrow = d.trend === 'up' ? '▲' : d.trend === 'dn' ? '▼' : '▶';
    const arrowCol = d.trend === 'up' ? '#60D090' : d.trend === 'dn' ? '#FF7070' : '#8AAAC0';
    const nm = p.label.length > 3 ? p.label.substring(0, 3) : p.label;
    addText(g, cx, cy - 4, nm, '#B0C8E0', 6.5, p.label.length > 3 ? 'tiny' : '');
    addText(g, cx, cy + 6, arrow, arrowCol, 7, '');
  });
}

function buildMetroSVG() {
  const g = document.getElementById('metro-map');
  g.innerHTML = '';

  // 수도권 투영 함수: [경도, 위도] → SVG [x, y]
  // 뷰 범위: lon 126.20~127.75, lat 36.87~37.80
  function projM(lon, lat) {
    return [(lon - 126.20) / 1.55 * 680 + 20,
            (37.80 - lat) / 0.93 * 520 + 20];
  }

  // 배경
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('x', '0'); bg.setAttribute('y', '0');
  bg.setAttribute('width', '720'); bg.setAttribute('height', '560');
  bg.setAttribute('fill', '#0A1622');
  g.appendChild(bg);

  // 경기도 배경 (수도권 영역 표시)
  const ggPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  const ggBnd = [[126.20,37.80],[127.75,37.80],[127.75,36.87],[126.20,36.87]];
  ggPoly.setAttribute('points', ggBnd.map(([ln,lt])=>{ const[x,y]=projM(ln,lt);return x.toFixed(0)+','+y.toFixed(0);}).join(' '));
  ggPoly.setAttribute('fill', '#0D1824'); ggPoly.setAttribute('stroke', 'none');
  g.appendChild(ggPoly);

  // 서울 외곽 (지리적 경계, 6개 꼭짓점)
  const seoulBnd = [
    [126.793,37.710],[127.073,37.710],[127.185,37.670],
    [127.185,37.430],[126.855,37.428],[126.793,37.520]
  ];
  const seoulPts = seoulBnd.map(([ln,lt])=>{const[x,y]=projM(ln,lt);return x.toFixed(0)+','+y.toFixed(0);}).join(' ');
  const seoulPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  seoulPoly.setAttribute('points', seoulPts);
  seoulPoly.setAttribute('fill', '#162840');
  seoulPoly.setAttribute('stroke', '#2A4870');
  seoulPoly.setAttribute('stroke-width', '1.5');
  seoulPoly.setAttribute('opacity', '0.8');
  g.appendChild(seoulPoly);
  const [slx, sly] = projM(126.985, 37.568);
  addText(g, slx, sly, '서울', '#4A7A9A', 13, '');

  // 한강 (수도권 뷰)
  const hrPts = [[126.793,37.560],[126.920,37.520],[127.000,37.520],[127.090,37.512],[127.185,37.555]];
  const hrCoords = hrPts.map(([ln,lt])=>{const[x,y]=projM(ln,lt);return x.toFixed(0)+','+y.toFixed(0);}).join(' ');
  const hr = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  hr.setAttribute('points', hrCoords);
  hr.setAttribute('fill', 'none');
  hr.setAttribute('stroke', '#1A4A7A');
  hr.setAttribute('stroke-width', '6');
  hr.setAttribute('stroke-linecap', 'round');
  hr.setAttribute('opacity', '0.65');
  g.appendChild(hr);

  // 수도권 주요 도시 (지리 좌표 기반 원형 버블)
  METRO_GEO.forEach(c => {
    const d = METRO[c.key];
    if (!d) return;
    const col = GRADE_COLOR[d.grade] || '#1A3050';
    const stk = GRADE_STROKE[d.grade] || '#4A6A90';
    const r = 30;
    const [cx, cy] = projM(c.lon, c.lat);

    const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circ.setAttribute('cx', cx.toFixed(1));
    circ.setAttribute('cy', cy.toFixed(1));
    circ.setAttribute('r', r);
    circ.setAttribute('fill', col);
    circ.setAttribute('stroke', stk);
    circ.setAttribute('stroke-width', '1.5');
    circ.setAttribute('class', 'city-bubble');
    circ.setAttribute('id', 'city-' + c.key);
    circ.addEventListener('click', () => selectRegion(c.key, 'METRO'));
    g.appendChild(circ);

    const lbl = c.label.split('/')[0];
    addText(g, cx, cy - 5, lbl, '#B0C8E0', 7.5, '');
    const arrow = d.trend === 'up' ? '▲' : d.trend === 'dn' ? '▼' : '▶';
    const arrowCol = d.trend === 'up' ? '#60D090' : d.trend === 'dn' ? '#FF7070' : '#8AAAC0';
    addText(g, cx, cy + 9, arrow, arrowCol, 8, '');
  });
}

function addText(parent, x, y, txt, fill, size, cls) {
  const el = document.createElementNS('http://www.w3.org/2000/svg','text');
  el.setAttribute('x', x); el.setAttribute('y', y);
  el.setAttribute('fill', fill); el.setAttribute('font-size', size);
  el.setAttribute('text-anchor','middle'); el.setAttribute('dominant-baseline','central');
  el.setAttribute('pointer-events','none'); el.setAttribute('font-weight','600');
  if (cls) el.setAttribute('class', cls);
  el.textContent = txt;
  parent.appendChild(el);
}

/* ─── 탭 전환 ─── */
function switchMap(which) {
  curMap = which;
  selKey = null;
  document.getElementById('panel-detail').style.display = 'none';
  document.getElementById('panel-empty').style.display = 'block';
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (which==='seoul'&&i===0)||(which==='metro'&&i===1)));
  document.getElementById('seoul-map').setAttribute('display', which === 'seoul' ? '' : 'none');
  document.getElementById('metro-map').setAttribute('display', which === 'metro' ? '' : 'none');
}

/* ─── 지역 선택 ─── */
function selectRegion(key, source) {
  const data = source === 'METRO' ? METRO : REGIONS;
  const d = data[key];
  if (!d) return;

  // 이전 선택 해제
  if (selKey) {
    const prev = document.getElementById('poly-' + selKey) || document.getElementById('city-' + selKey);
    if (prev) prev.classList.remove('selected');
  }
  selKey = key;
  const el = document.getElementById('poly-' + key) || document.getElementById('city-' + key);
  if (el) el.classList.add('selected');

  renderPanel(d, key);
}

function renderPanel(d, key) {
  document.getElementById('panel-empty').style.display = 'none';
  const det = document.getElementById('panel-detail');
  det.style.display = 'block';

  const gcolor = GRADE_STROKE[d.grade] || '#4A6A90';
  const trendIcon = d.trend === 'up' ? '▲ 상승세' : d.trend === 'dn' ? '▼ 약세' : '▶ 보합';
  const trendClass = d.trend === 'up' ? 'up' : d.trend === 'dn' ? 'dn' : 'fl';
  const chgStr = (d.chg >= 0 ? '+' : '') + d.chg.toFixed(1) + '%';
  const priceStr = (d.price / 10000).toFixed(1) + '억';
  const regHtml = d.reg.map(r => {
    const cls = r.includes('토지') ? 'rc-s' : r.includes('투기') ? 'rc-r' : r.includes('조정') ? 'rc-p' : 'rc-n';
    return `<span class="reg-chip ${cls}">${r}</span>`;
  }).join('');
  const hotHtml = (d.hot || []).map(h => `<div class="hot-item"><div class="hi-dot hi-${h.t}"></div><div>${h.txt}</div></div>`).join('');
  const nearbyHtml = (d.nearby || []).map(n => `<span class="nb-tag">${n}</span>`).join('');

  det.innerHTML = `
    <div class="region-header">
      <div class="rh-badge" style="background:${gcolor}22;color:${gcolor};border:1px solid ${gcolor}44;">
        ${d.grade} 등급 &nbsp;|&nbsp; ${d.area}
      </div>
      <div class="rh-name">${d.name}</div>
      <div class="rh-sub">${d.desc}</div>
    </div>
    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-v">${priceStr}</div>
        <div class="kpi-l">84㎡ 평균 매매가</div>
      </div>
      <div class="kpi">
        <div class="kpi-v ${trendClass}">${chgStr}</div>
        <div class="kpi-l">전년대비 변동률</div>
      </div>
      <div class="kpi">
        <div class="kpi-v">${d.jse}%</div>
        <div class="kpi-l">전세가율</div>
      </div>
      <div class="kpi">
        <div class="kpi-v ${trendClass}">${trendIcon}</div>
        <div class="kpi-l">시장 방향성</div>
      </div>
    </div>
    <div class="info-block">
      <div class="ib-ttl">규제 현황</div>
      <div class="ib-body">${regHtml || '<span style="color:var(--ink3)">규제지역 없음</span>'}</div>
    </div>
    <div class="info-block">
      <div class="ib-ttl">최근 주요 이슈</div>
      ${hotHtml}
    </div>
    ${d.nearby && d.nearby.length ? `
    <div class="info-block">
      <div class="ib-ttl">인접 지역</div>
      <div class="nearby">${nearbyHtml}</div>
    </div>` : ''}
  `;
}
